        }

        }

            background: rgba(233,69,96,0.2);
        }

            background: #e94560;
            border-color: #e94560;
        }

            padding-left: 20px;

            color: #ccc;
            font-size: 0.9em;

            position: absolute;
            left: 0;
            color: #4ade80;
        }

        .exercise-card .reps-info {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

            font-size: 0.85em;

            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a2e;

</head>

                gifUrl: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMnV4cWNnMHg3dXN5d2x4Y2pxNnlqY2p6YnF5dXc4cG1mcXg5YnJ6ZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/l2Je9rFF6VrIISyT6/giphy.gif",
                instructions: [
                    "坐在凳子，前臂放在大腿上",
                    "手掌握啞鈴，手腕懸空",
                    "向上彎曲手腕（屈曲）",
                    "然後向下伸展手腕",
                    "保持緩慢、控制的速度"
                ],
                reps: "12-15 次",
                videoUrl: "https://www.youtube.com/results?search_query=wrist+curls+extensions+form"
            },
            {
                id: 14,
                name: "Push-ups",
                nameCn: "俯臥撐",
                emoji: "💪",
                category: "upper",
                muscleGroup: "胸、肩、三頭、核芯",
                gifUrl: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMnZycG14c3M5dnd6cDdiY3Z0b3F4eWx2c2g4dnR1dHl5eTRwNDF0ciZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o7btNu5cX2e0XjCD2/giphy.gif",
                instructions: [
                    "雙手撐地，與肩同寬",
                    "身體保持一直線",
                    "彎曲手肘，慢慢下降",
                    "胸部接近地面",
                    "推起回到起始位置"
                ],
                reps: "10-15 次",
                videoUrl: "https://www.youtube.com/results?search_query=push+ups+proper+form"
            },
            {
                id: 15,
                name: "Bodyweight Squats",
                nameCn: "深蹲",
                emoji: "🦵",
                category: "warmup",
                muscleGroup: "Quad、臀部、膝蓋穩定性",
                gifUrl: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNnVmcXJ6dGVwY3h4Y2p4ZW4xbmV0dHBzZW9nZHRmcG5lbXF6aWZyZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/26n7b7PjNtXFE3M0E/giphy.gif",
                instructions: [
                    "雙腳與肩同寬站立",
                    "慢慢下蹲，臀部向後",
                    "膝蓋保持在腳趾上方",
                    "大腿與地面平行",
                    "用力推腳跟站起"
                ],
                reps: "15-20 次",
                videoUrl: "https://www.youtube.com/results?search_query=bodyweight+squat+form"
            }
        ];

        let currentCategory = 'all';
        let searchTerm = '';

        // Category names mapping
        const categoryNames = {
            'all': '全部',
            'warmup': '熱身',
            'lower': '下肢',
            'upper': '上肢',
            'core': '核心',
            'mobility': '靈活',
            'sport': '運動專項'
        };

        function init() {
            renderExercises();
            updateStats();
        }

        function renderExercises() {
            const grid = document.getElementById('exercisesGrid');
            const noResults = document.getElementById('noResults');
            
            const filtered = exercises.filter(ex => {
                const matchCategory = currentCategory === 'all' || ex.category === currentCategory;
                const matchSearch = searchTerm === '' || 
                    ex.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    ex.nameCn.includes(searchTerm) ||
                    ex.muscleGroup.toLowerCase().includes(searchTerm.toLowerCase());
                return matchCategory && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');

            grid.innerHTML = filtered.map(ex => `
                <div class="exercise-card" data-id="${ex.id}">
                    <h3>
                        <span class="emoji">${ex.emoji}</span>
                        ${ex.name}
                        <span class="category-badge">${categoryNames[ex.category]}</span>
                    </h3>
                    <p class="muscle-group">${ex.muscleGroup}</p>
                    
                    <div class="gif-container">
                        <img src="${ex.gifUrl}" alt="${ex.name}" 
                             onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=placeholder>🎬</div>'"
                             loading="lazy">
                    </div>
                    
                    <div class="instructions">
                        <h4>動作說明</h4>
                        <ul>
                            ${ex.instructions.map(step => `<li>${step}</li>`).join('')}
                        </ul>
                    </div>
                    
                    <div class="reps-info">
                        <span>📊 ${ex.reps}</span>
                    </div>
                    
                    <a href="${ex.videoUrl}" target="_blank" class="video-link">
                        🎥 觀看影片示範
                    </a>
                </div>
            `).join('');

            // Update count
            document.getElementById('totalCount').textContent = filtered.length;
        }

        function filterCategory(cat) {
            currentCategory = cat;
            
            // Update tab UI
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.classList.toggle('active', tab.textContent.includes(categoryNames[cat]) || (cat === 'all' && tab.textContent.includes('全部')));
            });
            
            renderExercises();
        }

        function filterExercises() {
            searchTerm = document.getElementById('searchInput').value;
            renderExercises();
        }

        function updateStats() {
            document.getElementById('categoryCount').textContent = Object.keys(categoryNames).length - 1; // minus 'all'
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize
        init();
    </script>
</body>
</html>
