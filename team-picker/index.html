<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pickleball Team Picker</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui; background: #1a1a2e; color: white; padding: 15px; min-height: 100vh; }
h1 { text-align: center; margin-bottom: 5px; }
p { text-align: center; color: #888; margin-bottom: 15px; font-size: 0.9em; }
.pool, .games { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
h2 { font-size: 1em; margin-bottom: 10px; color: #667eea; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 14px; border-radius: 20px; background: linear-gradient(135deg, #667eea, #764ba2); font-size: 0.9em; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.chip.selected { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
.chip.taken { opacity: 0.3; cursor: default; }
.dupr { font-size: 0.75em; background: rgba(255,255,255,0.2); padding: 2px 6px; border-radius: 10px; }
.match-btns { display: flex; gap: 10px; margin-bottom: 15px; }
.match-btn { flex: 1; padding: 12px; background: rgba(255,255,255,0.1); border: 2px solid transparent; border-radius: 12px; color: white; cursor: pointer; font-size: 1em; }
.match-btn.active { background: rgba(102,126,234,0.3); border-color: #667eea; }
.match-label { font-size: 0.85em; font-weight: bold; margin-bottom: 10px; color: #667eea; }
.game { background: rgba(0,0,0,0.2); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
.game-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9em; }
.gtype { font-size: 0.8em; color: #10b981; }
.gtype.men { color: #3b82f6; }
.gtype.women { color: #f472b6; }
.teams { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; font-size: 0.85em; }
.team { display: flex; flex-direction: column; gap: 4px; }
.team-right { text-align: right; }
.slot { background: rgba(255,255,255,0.1); border: 2px dashed rgba(255,255,255,0.2); border-radius: 20px; padding: 8px 12px; text-align: center; cursor: pointer; color: rgba(255,255,255,0.4); min-height: 36px; }
.slot.men { background: rgba(59,130,246,0.3); border-color: #3b82f6; }
.slot.women { background: rgba(244,114,182,0.3); border-color: #f472b6; }
.slot.filled-men { background: linear-gradient(135deg, #3b82f6, #1d4ed8); border: none; color: white; cursor: default; }
.slot.filled-women { background: linear-gradient(135deg, #f472b6, #db2777); border: none; color: white; cursor: default; }
.vs { color: #fbbf24; font-weight: bold; }
.reset { display: block; margin: 15px auto; padding: 12px 30px; background: #ef4444; border: none; border-radius: 25px; color: white; font-size: 1em; cursor: pointer; }
footer { text-align: center; margin-top: 20px; color: #666; font-size: 0.8em; }
</style>
</head>
<body>
<h1>Pickleball Team Picker</h1>
<p>Click player, then click slot to assign</p>
<div class="pool">
  <h2>Players</h2>
  <div class="chips" id="chips"></div>
</div>
<div class="games">
  <h2>Schedule</h2>
  <div class="match-btns">
    <button class="match-btn active" onclick="setMatches(1)">1 Match<br><small>5 games</small></button>
    <button class="match-btn" onclick="setMatches(2)">2 Matches<br><small>10 games</small></button>
  </div>
  <div id="schedule"></div>
</div>
<button class="reset" onclick="resetAll()">Reset All</button>
<footer><a href="https://github.com/raycoderhk/mini-games" style="color:#667eea">GitHub</a></footer>
<script>
const players = [
  {n:"Raymond",g:"M",d:3.5},{n:"Edmond",g:"M",d:3.2},{n:"Ivan",g:"M",d:3.2},
  {n:"Ken",g:"M",d:2.8},{n:"Keith",g:"M",d:2.9},{n:"Agnes",g:"F",d:3.0},
  {n:"Nicole",g:"F",d:3.1},{n:"Vicky",g:"F",d:3.3},{n:"Kelly",g:"F",d:3.2},{n:"Jerry",g:"M",d:2.9}
];
let sel = null, matches = 1, slots = {};
function render(){
  const el = document.getElementById("chips");
  const used = Object.values(slots);
  el.innerHTML = players.map(p=>{
    const used = Object.values(slots).includes(p.n);
    const cls = "chip" + (sel===p.n?" selected":"") + (used?" taken":"");
    const onclick = used?"":' onclick="sel(\''+p.n+'\')"';
    return '<div class="'+cls+'"'+onclick+'>'+(p.g==="F"?"👩":"👨")+" "+p.n+' <span class="dupr">'+p.d+"</span></div>";
  }).join("");
  renderGames();
}
function sel(n){sel=sel===n?null:n;render();}
function setMatches(m){matches=m;slots={};sel=null;render();document.querySelectorAll(".match-btn").forEach((b,i)=>b.classList.toggle("active",i===m-1));}
function renderGames(){
  const el=document.getElementById("schedule");
  let html="";
  for(let mi=1;mi<=matches;mi++){
    if(matches>1)html+='<div style="font-weight:bold;color:#667eea;margin:10px 0 5px">Match '+mi+"</div>";
    const types=["Men's Doubles","Women's Doubles","Mixed Doubles","Mixed Doubles","Mixed Doubles"];
    const tcls=["men","women","mixed","mixed","mixed"];
    for(let gi=1;gi<=5;gi++){
      const sid=mi+"-"+gi;
      const p1=slots[sid+"-p1"]||null,p2=slots[sid+"-p2"]||null,p3=slots[sid+"-p3"]||null,p4=slots[sid+"-p4"]||null;
      html+='<div class="game"><div class="game-header"><span>Game '+gi+'</span><span class="gtype '+tcls[gi-1]+'">'+types[gi-1]+"</span></div>";
      html+='<div class="teams"><div class="team">';
      html+='<div class="slot'+(p1?" filled-men":"")+'" onclick="slot(\''+sid+"-p1','M\')">'+(p1||"👨 + 👨")+"</div>";
      html+='<div class="slot'+(p3?" filled-women":"")+'" onclick="slot(\''+sid+"-p3','F\')">'+(p3||"👩 + 👩")+"</div>";
      html+="</div><span class=vs>VS</span><div class=team style=text-align:right>";
      html+='<div class="slot'+(p2?" filled-men":"")+'" onclick="slot(\''+sid+"-p2','M\')">'+(p2||"👨 + 👨")+"</div>";
      html+='<div class="slot'+(p4?" filled-women":"")+'" onclick="slot(\''+sid+"-p4','F\')">'+(p4||"👩 + 👩")+"</div>";
      html+="</div></div></div>";
    }
  }
  el.innerHTML=html;
}
function slot(id,gender){
  if(slots[id]){delete slots[id];sel=null;render();return;}
  if(!sel)return;
  slots[id]=sel;sel=null;render();
}
function resetAll(){slots={};sel=null;render();}
render();
</script>
</body>
</html>
