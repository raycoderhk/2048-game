<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎾 Pickleball Team Picker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            padding: 20px;
            color: white;
        }
        h1 { text-align: center; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 20px; font-size: 0.9em; }
        
        .container { max-width: 900px; margin: 0 auto; }
        
        .section {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 1.1em;
            margin-bottom: 15px;
            color: #667eea;
        }
        
        .players-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            min-height: 60px;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
        }
        .player-chip {
            padding: 8px 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 20px;
            cursor: grab;
            user-select: none;
            font-size: 0.95em;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .player-chip:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102,126,234,0.4);
        }
        .player-chip.dragging {
            opacity: 0.5;
            transform: scale(0.95);
        }
        .player-chip .gender {
            font-size: 0.8em;
            opacity: 0.8;
        }
        .player-chip .dupr {
            font-size: 0.75em;
            background: rgba(255,255,255,0.2);
            padding: 2px 6px;
            border-radius: 10px;
        }
        
        .courts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 600px) {
            .courts { grid-template-columns: 1fr; }
        }
        .court {
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            padding: 15px;
        }
        .court-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #4ade80;
            display: flex;
            justify-content: space-between;
        }
        .court-title button {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8em;
        }
        .court-title button:hover { background: rgba(255,255,255,0.2); }
        
        .teams {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .team {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 10px;
            min-height: 120px;
        }
        .team-label {
            font-size: 0.8em;
            color: #888;
            margin-bottom: 8px;
        }
        .team-players {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 80px;
        }
        .team-slot {
            background: rgba(255,255,255,0.1);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 8px 12px;
            text-align: center;
            color: rgba(255,255,255,0.4);
            font-size: 0.85em;
        }
        .team-slot.filled {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: white;
            cursor: grab;
        }
        .team-slot.filled:hover {
            box-shadow: 0 2px 10px rgba(102,126,234,0.4);
        }
        .team-slot.female { background: linear-gradient(135deg, #f472b6, #db2777); }
        .team-slot.male { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
        
        .games-section {
            margin-top: 20px;
        }
        .games-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #fbbf24;
        }
        .games-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 10px;
        }
        .game-card {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 12px;
        }
        .game-header {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 8px;
        }
        .game-match {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .game-team {
            text-align: center;
            flex: 1;
        }
        .game-team-label {
            font-size: 0.75em;
            color: #666;
        }
        .game-vs {
            color: #fbbf24;
            font-weight: bold;
            padding: 0 10px;
        }
        
        .reset-btn {
            display: block;
            margin: 20px auto;
            padding: 12px 30px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .reset-btn:hover { transform: scale(1.05); }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            color: #666;
            font-size: 0.85em;
        }
        .footer a { color: #667eea; text-decoration: none; }
        
        /* Drag states */
        .drag-over { background: rgba(102,126,234,0.2) !important; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎾 Pickleball Team Picker</h1>
        <p class="subtitle">拖放球員到球場，自動排列五個 game</p>
        
        <div class="section">
            <div class="section-title">👥 球員名單（拖放到球場）</div>
            <div class="players-pool" id="playersPool"></div>
        </div>
        
        <div class="section">
            <div class="section-title">🏓 球場</div>
            <div class="courts">
                <div class="court" id="court1">
                    <div class="court-title">
                        <span>Court 1</span>
                        <button onclick="clearCourt(1)">清除</button>
                    </div>
                    <div class="teams">
                        <div class="team">
                            <div class="team-label">👥 Team A</div>
                            <div class="team-players" id="court1-team1"></div>
                        </div>
                        <div class="team">
                            <div class="team-label">👥 Team B</div>
                            <div class="team-players" id="court1-team2"></div>
                        </div>
                    </div>
                </div>
                <div class="court" id="court2">
                    <div class="court-title">
                        <span>Court 2</span>
                        <button onclick="clearCourt(2)">清除</button>
                    </div>
                    <div class="teams">
                        <div class="team">
                            <div class="team-label">👥 Team C</div>
                            <div class="team-players" id="court2-team1"></div>
                        </div>
                        <div class="team">
                            <div class="team-label">👥 Team D</div>
                            <div class="team-players" id="court2-team2"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="section games-section">
            <div class="games-title">🎯 建議 5 個 Game 順序</div>
            <div class="games-list" id="gamesList"></div>
        </div>
        
        <button class="reset-btn" onclick="resetAll()">🔄 重置所有</button>
        
        <div class="footer">
            <p>Last updated: <span id="lastUpdated"></span></p>
            <p><a href="https://github.com/raycoderhk/mini-games" target="_blank">GitHub</a></p>
        </div>
    </div>
    
    <script>
        // Default players - update this list with your players
        const defaultPlayers = [
            { name: 'Raymond', gender: 'M', dupr: '3.5' },
            { name: 'Edmond', gender: 'M', dupr: '3.2' },
            { name: 'Ivan', gender: 'M', dupr: '3.2' },
            { name: 'Ken', gender: 'M', dupr: '2.8' },
            { name: 'Keith', gender: 'M', dupr: '2.9' },
            { name: 'Agnes', gender: 'F', dupr: '3.0' },
            { name: 'Nicole', gender: 'F', dupr: '3.1' },
            { name: 'Vicky', gender: 'F', dupr: '3.3' },
            { name: 'Kelly', gender: 'F', dupr: '3.2' },
            { name: 'Jerry', gender: 'M', dupr: '2.9' },
            // Add more players here
        ];
        
        let players = [...defaultPlayers];
        let courts = {
            court1: { team1: [], team2: [] },
            court2: { team1: [], team2: [] }
        };
        let draggedPlayer = null;
        
        function init() {
            document.getElementById('lastUpdated').textContent = new Date().toLocaleString('zh-HK');
            renderPlayersPool();
            updateGames();
        }
        
        function renderPlayersPool() {
            const pool = document.getElementById('playersPool');
            // Get all assigned players
            const assigned = [
                ...courts.court1.team1,
                ...courts.court1.team2,
                ...courts.court2.team1,
                ...courts.court2.team2
            ];
            const assignedNames = assigned.map(p => p.name);
            const available = players.filter(p => !assignedNames.includes(p.name));
            
            pool.innerHTML = available.map(p => createPlayerChip(p)).join('');
            pool.querySelectorAll('.player-chip').forEach(chip => {
                chip.addEventListener('dragstart', handleDragStart);
                chip.addEventListener('dragend', handleDragEnd);
            });
        }
        
        function createPlayerChip(player) {
            const genderIcon = player.gender === 'F' ? '👩' : '👨';
            return `
                <div class="player-chip" draggable="true" data-name="${player.name}" data-gender="${player.gender}" data-dupr="${player.dupr}">
                    ${genderIcon} ${player.name}
                    <span class="dupr">${player.dupr}</span>
                </div>
            `;
        }
        
        function handleDragStart(e) {
            draggedPlayer = {
                name: e.target.dataset.name,
                gender: e.target.dataset.gender,
                dupr: e.target.dataset.dupr
            };
            e.target.classList.add('dragging');
        }
        
        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
            draggedPlayer = null;
            renderPlayersPool();
            updateGames();
        }
        
        function handleDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        }
        
        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }
        
        function handleDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            if (!draggedPlayer) return;
            
            const slot = e.currentTarget;
            const court = slot.dataset.court;
            const team = slot.dataset.team;
            
            // Check if slot is already filled
            const existing = courts[court][team].find(p => p.name === draggedPlayer.name);
            if (existing) return;
            
            // Remove from any other slot if already assigned
            ['court1', 'court2'].forEach(c => {
                ['team1', 'team2'].forEach(t => {
                    courts[c][t] = courts[c][t].filter(p => p.name !== draggedPlayer.name);
                });
            });
            
            // Add to slot
            courts[court][team].push(draggedPlayer);
            
            renderPlayersPool();
            renderCourts();
            updateGames();
        }
        
        function renderCourts() {
            [1, 2].forEach(courtNum => {
                ['team1', 'team2'].forEach((teamKey, idx) => {
                    const container = document.getElementById(`court${courtNum}-${teamKey}`);
                    const team = courts[`court${courtNum}`][teamKey];
                    const court = courts[`court${courtNum}`];
                    const allTeams = [court.team1, court.team2].flat();
                    const isMaleTeam = teamKey === 'team1' || team.length === 0 ? teamKey === 'team1' : team[0].gender === 'M';
                    
                    // 2 slots per team
                    container.innerHTML = team.map((p, i) => `
                        <div class="team-slot filled ${p.gender === 'F' ? 'female' : 'male'}">
                            ${p.gender === 'F' ? '👩' : '👨'} ${p.name} <span class="dupr">${p.dupr}</span>
                        </div>
                    `).join('') + 
                    (team.length < 2 ? `<div class="team-slot" data-court="court${courtNum}" data-team="${teamKey}">+ 拖放球員</div>` : '');
                    
                    // Add drop handlers to empty slot
                    const emptySlot = container.querySelector('.team-slot:not(.filled)');
                    if (emptySlot) {
                        emptySlot.addEventListener('dragover', handleDragOver);
                        emptySlot.addEventListener('dragleave', handleDragLeave);
                        emptySlot.addEventListener('drop', handleDrop);
                    }
                });
            });
        }
        
        function clearCourt(courtNum) {
            courts[`court${courtNum}`] = { team1: [], team2: [] };
            renderPlayersPool();
            renderCourts();
            updateGames();
        }
        
        function resetAll() {
            courts = {
                court1: { team1: [], team2: [] },
                court2: { team1: [], team2: [] }
            };
            renderPlayersPool();
            renderCourts();
            updateGames();
        }
        
        function updateGames() {
            const allTeams = [
                courts.court1.team1,
                courts.court1.team2,
                courts.court2.team1,
                courts.court2.team2
            ].filter(t => t.length === 2);
            
            const gamesList = document.getElementById('gamesList');
            
            if (allTeams.length < 2) {
                gamesList.innerHTML = '<div style="color:#888;text-align:center;padding:20px;">需要至少2隊完成先可以顯示建議</div>';
                return;
            }
            
            let html = '';
            for (let i = 0; i < 5; i++) {
                const team1 = allTeams[i % allTeams.length];
                const team2 = allTeams[(i + 1) % allTeams.length];
                
                // Avoid same gender matchups when possible
                let matchup = [team1, team2];
                if (team1[0].gender === team2[0].gender) {
                    // Same gender - try to find better match
                    for (let j = 0; j < allTeams.length; j++) {
                        if (j !== i % allTeams.length && j !== (i + 1) % allTeams.length) {
                            const other = allTeams[j];
                            if (team1[0].gender !== other[0].gender) {
                                matchup = [team1, other];
                                break;
                            }
                        }
                    }
                }
                
                html += `
                    <div class="game-card">
                        <div class="game-header">Game ${i + 1}</div>
                        <div class="game-match">
                            <div class="game-team">
                                <div class="game-team-label">${matchup[0].map(p => p.name).join(' + ')}</div>
                                <div>${matchup[0].map(p => `${p.gender === 'F' ? '👩' : '👨'}${p.dupr}`).join(' / ')}</div>
                            </div>
                            <div class="game-vs">VS</div>
                            <div class="game-team">
                                <div class="game-team-label">${matchup[1].map(p => p.name).join(' + ')}</div>
                                <div>${matchup[1].map(p => `${p.gender === 'F' ? '👩' : '👨'}${p.dupr}`).join(' / ')}</div>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            gamesList.innerHTML = html;
        }
        
        // Initialize
        init();
    </script>
</body>
</html>
