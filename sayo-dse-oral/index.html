var mockRunning=false,mockPaused=false,mockIdx=0,mockStart=0,mockTO=null;
var curComp=null,compQ=0,compScore=0;
var recordings=JSON.parse(localStorage.getItem('sayo_recordings')||'[]');

// Init
function init(){
  renderTopics();
  var v=synth.getVoices();
  if(v.length)loadVoices(v);
  synth.onvoiceschanged=function(){loadVoices(synth.getVoices())};
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){
    rec=new SR();
    rec.continuous=false;
    rec.interimResults=true;
    rec.lang='en-US';
    rec.onresult=function(e){
      var fin='',int='';
      for(var i=e.resultIndex;i<e.results.length;i++){
        var t=e.results[i][0].transcript;
        if(e.results[i].isFinal)fin+=t;else int+=t;
      }
      document.getElementById('status').textContent=int||'Processing...';
      if(fin){addMsg('you',fin);synthResp(fin);}
    };
    rec.onerror=function(){document.getElementById('status').textContent='Try again...';};
    rec.onend=function(){
      isRec=false;
      document.getElementById('micBtn').classList.remove('recording');
    };
  }
  document.getElementById('apiKeyInput').value=apiKey;
  checkKeyStatus();
}

function loadVoices(v){
  var en=v.filter(function(x){return x.lang.startsWith('en')});
  var base=en.length?en:v;
  VOICES.Sarah.v=base.find(function(x){return x.name.includes('Female')})||base[0];
  VOICES.Mike.v=base.find(function(x){return x.name.includes('Male')})||base[1]||base[0];
  VOICES.Amy.v=base.find(function(x){return x.name.includes('Female')})||base[0];
}

function renderTopics(){
  var el=document.getElementById('topicList');
  el.innerHTML='';
  TOPICS.forEach(function(t){
    var div=document.createElement('div');
    div.className='topic-card';
    div.innerHTML='<div class="cat">'+t.cat+'</div><div class="q">'+t.q.substring(0,60)+'...</div>';
    div.onclick=function(){selectTopic(t)};
    el.appendChild(div);
  });
}

function selectTopic(t){
  curTopic=t;
  document.getElementById('welcome').style.display='none';
  document.getElementById('controls').style.display='block';
  document.getElementById('topicBar').style.display='block';
  document.getElementById('compView').style.display='none';
  document.getElementById('mockView').style.display='none';
  document.getElementById('recordView').style.display='none';
  document.getElementById('topicQ').textContent=t.q;
  document.getElementById('topicD').textContent=t.d;
  document.getElementById('messages').innerHTML='';
  setTimeout(function(){playC('Sarah')},500);
}

function startRandom(){
  selectTopic(TOPICS[Math.floor(Math.random()*TOPICS.length)]);
}

function addMsg(speaker,text){
  var div=document.createElement('div');
  div.className='msg';
  div.innerHTML='<div class="avatar '+speaker.toLowerCase()+'">'+speaker[0].toUpperCase()+'</div><div class="msg-body"><div class="msg-header"><span class="name">'+speaker+'</span><span class="time">'+new Date().toLocaleTimeString()+'</span></div><div class="text">'+text+'</div></div>';
  document.getElementById('messages').appendChild(div);
  document.getElementById('messages').scrollTop=99999;
}

async function speak(text,cand,onEnd){
  if(isSpeaking){if(onEnd)onEnd();return;}
  if(apiKey&&apiKey.length>10){
    return new Promise(function(res){
      var voices={Sarah:'Cantonese_GentleLady',Mike:'Cantonese_PlayfulMan',Amy:'male-qn-qingse'};
      var cfg={Sarah:{s:1,p:0},Mike:{s:1.1,p:2},Amy:{s:.95,p:1}};
      var v=voices[cand]||'Cantonese_GentleLady';
      var c=cfg[cand]||{s:1,p:0};
      fetch('https://api.minimaxi.com/v1/t2a_v2',{
        method:'POST',
        headers:{'Authorization':'Bearer '+apiKey,'Content-Type':'application/json'},
        body:JSON.stringify({model:'speech-2.8-hd',text:text,stream:false,output_format:'url',voice_setting:{voice_id:v,speed:c.s,pitch:c.p},audio_setting:{sample_rate:32000,bitrate:128000,format:'mp3',channel:1}})
      }).then(function(r){return r.json()})
      .then(function(d){
        var url=d.data&&d.data.audio;
        if(url){
          var audio=new Audio(url);
          audio.onend=function(){isSpeaking=false;if(onEnd)onEnd();res()};
          audio.onerror=function(){isSpeaking=false;if(onEnd)onEnd();res()};
          curAudio=audio;isSpeaking=true;updatePauseBtn();
          audio.play();
          return;
        }
        fallbackTTS(text,cand,onEnd,res);
      }).catch(function(){fallbackTTS(text,cand,onEnd,res)});
    });
  }else{
    fallbackTTS(text,cand,onEnd);
  }
}

function fallbackTTS(text,cand,onEnd,res){
  synth.cancel();isPaused=false;
  var u=new SpeechSynthesisUtterance(text);
  var v=VOICES[cand];
  u.voice=v.v;u.rate=v.r;u.pitch=v.p;
  curAudio=u;isSpeaking=true;
  u.onend=function(){isSpeaking=false;if(onEnd)onEnd();if(res)res()};
  u.onerror=function(){isSpeaking=false;if(onEnd)onEnd();if(res)res()};
  synth.speak(u);
  updatePauseBtn();
  if(res)res();
}

function pauseRes(){
  if(!curAudio)return;
  if(isPaused){curAudio.play();isPaused=false;}
  else{curAudio.pause();isPaused=true;}
  updatePauseBtn();
}

function stopSpeak(){
  if(curAudio&&curAudio.pause){curAudio.pause();curAudio.currentTime=0;}
  else synth.cancel();
  curAudio=null;isSpeaking=false;isPaused=false;updatePauseBtn();
}

function updatePauseBtn(){
  var btn=document.getElementById('pauseBtn');
  if(!curAudio){btn.textContent='⏸️ Pause';btn.disabled=true;}
  else{btn.disabled=false;btn.textContent=isPaused?'▶ Resume':'⏸️ Pause';}
}

async function playC(name){
  if(isSpeaking)return;
  var btn=document.getElementById(name.toLowerCase()+'Btn');
  btn.classList.add('active');
  var prompts={
    Sarah:'Hello everyone, I am Sarah. '+curTopic.q+' What do you all think?',
    Mike:'I am Mike. '+curTopic.q+' Let me share my perspective.',
    Amy:'Hi, I am Amy. I agree with views on '+curTopic.q+' Let me add points.'
  };
  addMsg(name,prompts[name]);
  await speak(prompts[name],name,function(){btn.classList.remove('active');document.getElementById('status').textContent='Your turn';});
}

async function synthResp(text){
  if(isSpeaking)return;
  document.getElementById('status').textContent='Thinking...';
  await new Promise(function(r){setTimeout(r,600)});
  var tx=text.toLowerCase();
  var isAgree=/\b(agree|yes|support|true|good|right|definitely)\b/.test(tx);
  var isDisagree=/\b(disagree|no|not|wrong|against|false)\b/.test(tx);
  var resp={
    Sarah:["That is a good point. Let me add that we should consider practical implementation.","Could you elaborate on how this would work in Hong Kong schools?"],
    Mike:["I hear your concern. What about the challenges?","I am skeptical. More evidence needed.","But unintended consequences worry me."],
    Amy:["I agree. Equal access matters.","Exactly! Practical solutions help everyone."]
  };
  if(isDisagree)resp={
    Sarah:["Valid point. What alternatives exist?","Could you suggest improvements?"],
    Mike:["I disagree. Here is why:","But consider the costs and benefits carefully."],
    Amy:["I understand concerns. What would change your view?"]
  };
  var c=['Sarah','Mike','Amy'][Math.floor(Math.random()*3)];
  if(isDisagree&&Math.random()>.4)c='Mike';
  if(isAgree&&Math.random()>.4)c='Amy';
  var pool=resp[c];
  var r=pool[Math.floor(Math.random()*pool.length)];
  addMsg(c,r);
  document.getElementById('status').textContent='Your turn';
  await speak(r,c);
}

function startRec(){
  if(!rec){document.getElementById('status').textContent='Not supported';return;}
  if(isSpeaking)return;
  isRec=true;
  document.getElementById('micBtn').classList.add('recording');
  document.getElementById('status').textContent='Listening...';
  rec.start();
}

function stopRec(){
  if(!isRec)return;
  isRec=false;
  document.getElementById('micBtn').classList.remove('recording');
  document.getElementById('status').textContent='Processing...';
  rec.stop();
}

function sendTxt(){
  var el=document.getElementById('txtInput');
  var txt=el.value.trim();
  if(!txt)return;
  el.value='';
  addMsg('you',txt);
  synthResp(txt);
}

// Mock Exam
function startMock(){
  document.getElementById('welcome').style.display='none';
  document.getElementById('controls').style.display='none';
  document.getElementById('topicBar').style.display='none';
  document.getElementById('compView').style.display='none';
  document.getElementById('recordView').style.display='none';
  document.getElementById('mockView').style.display='block';
  var t=curTopic||TOPICS[0];
  document.getElementById('mockView').innerHTML='<div class="mock-hdr"><h3>🎮 Mock Exam</h3><p>4 AI Candidates • 8-Minute Discussion</p><div class="mock-timer" id="mockTimer">00:00 / 08:00</div><div class="mock-topic">📝 '+t.q+'</div><div class="mock-data">📊 '+t.d+'</div></div><div class="mock-msgs" id="mockMsgs"></div><div style="text-align:center;padding:10px"><button id="mockPauseBtn" onclick="toggleMockPause()">⏸ Pause</button> <button id="mockStopBtn" onclick="stopMock()">⏹ Stop</button></div>';
  mockRunning=true;mockPaused=false;mockIdx=0;mockStart=Date.now();
  runMockTurn();
  updateMockTimer();
}

function toggleMockPause(){
  if(mockPaused){
    mockPaused=false;mockRunning=true;
    runMockTurn();
    updateMockTimer();
    document.getElementById('mockPauseBtn').textContent='⏸ Pause';
  }else{
    mockPaused=true;mockRunning=false;
    clearTimeout(mockTO);
    stopSpeak();
    document.getElementById('mockPauseBtn').textContent='▶ Resume';
  }
}

function stopMock(){
  mockRunning=false;mockPaused=false;
  clearTimeout(mockTO);
  stopSpeak();
  document.getElementById('mockView').style.display='none';
  document.getElementById('welcome').style.display='flex';
}

function runMockTurn(){
  if(!mockRunning||mockPaused)return;
  var script=MOCK_SCRIPTS[curTopic?curTopic.id:101]||MOCK_SCRIPTS[101];
  if(mockIdx>=script.length){stopMock();return;}
  var turn=script[mockIdx];
  var msgs=document.getElementById('mockMsgs');
  var colors={Sarah:'#3ba55c',Mike:'#f04747',Amy:'#f47b67',Ray:'#8e44ad'};
  var div=document.createElement('div');
  div.className='mock-msg '+turn.c.toLowerCase();
  div.innerHTML='<span class="nm" style="color:'+colors[turn.c]+'">'+turn.c+':</span> <span class="tx">'+turn.t+'</span>';
  msgs.appendChild(div);
  msgs.scrollTop=99999;
  speak(turn.t,turn.c,function(){});
  mockIdx++;
  mockTO=setTimeout(runMockTurn,10000);
}

function updateMockTimer(){
  if(!mockRunning||mockPaused)return;
  var e=Date.now()-mockStart;
  var s=Math.floor(e/1000),m=Math.floor(s/60),ss=s%60;
  document.getElementById('mockTimer').textContent=(m<10?'0':'')+m+':'+(ss<10?'0':'')+ss+' / 08:00';
  setTimeout(updateMockTimer,1000);
}

// Comprehension
function startComp(){
  document.getElementById('welcome').style.display='none';
  document.getElementById('controls').style.display='none';
  document.getElementById('topicBar').style.display='none';
  document.getElementById('mockView').style.display='none';
  document.getElementById('recordView').style.display='none';
  document.getElementById('compView').style.display='block';
  curComp=COMP[Math.floor(Math.random()*COMP.length)];
  compQ=0;compScore=0;
  showCompArt();
}

function showCompArt(){
  var v=document.getElementById('compView');
  v.innerHTML='<div class="comp-art"><h3>'+curComp.title+'</h3><p style="color:#888;font-size:10px">Source: '+curComp.src+'</p><div class="comp-art txt">'+curComp.art+'</div><button class="btn-main btn-comp" onclick="showCompQ()">Start Questions</button> <button class="btn-main back-btn" onclick="backHome()">Back</button></div>';
}

function showCompQ(){
  var q=curComp.qs[compQ],tot=curComp.qs.length;
  var h='<div class="comp-q"><p style="color:#e74c3c;font-size:11px;margin-bottom:6px">Question '+(compQ+1)+' of '+tot+'</p><p style="font-size:14px;font-weight:600;margin-bottom:12px">'+q.q+'</p>';
  q.o.forEach(function(opt,i){
    h+='<button class="opt-btn" id="optBtn'+i+'">'+String.fromCharCode(65+i)+'. '+opt+'</button>';
  });
  h+='</div>';
  document.getElementById('compView').innerHTML=h;
  q.o.forEach(function(opt,i){
    document.getElementById('optBtn'+i).onclick=function(){checkCompAns(i)};
  });
}

function checkCompAns(sel){
  var correct=curComp.qs[compQ].a;
  document.querySelectorAll('.opt-btn').forEach(function(btn,i){
    btn.disabled=true;
    if(i===correct)btn.classList.add('correct');
    if(i===sel&&sel!==correct)btn.classList.add('wrong');
  });
  if(sel===correct)compScore++;
  setTimeout(function(){
    compQ++;
    if(compQ<curComp.qs.length)showCompQ();
    else showCompRes();
  },1200);
}

function showCompRes(){
  var pct=Math.round((compScore/curComp.qs.length)*100);
  var grade=pct>=80?'A':pct>=60?'B':pct>=40?'C':'D';
  document.getElementById('compView').innerHTML='<div class="comp-res"><h3>Result: '+compScore+'/'+curComp.qs.length+' ('+pct+'%)</h3><p style="font-size:44px;color:#e74c3c;margin:12px 0">Grade: <strong>'+grade+'</strong></p><button class="btn-comp" onclick="startComp()">Try Another</button> <button class="btn-main back-btn" onclick="backHome()">Back</button></div>';
}

function backHome(){
  document.getElementById('compView').style.display='none';
  document.getElementById('mockView').style.display='none';
  document.getElementById('recordView').style.display='none';
  document.getElementById('welcome').style.display='flex';
}

// Recordings
function showRecordings(){
  document.getElementById('welcome').style.display='none';
  document.getElementById('controls').style.display='none';
  document.getElementById('topicBar').style.display='none';
  document.getElementById('compView').style.display='none';
  document.getElementById('mockView').style.display='none';
  document.getElementById('recordView').style.display='block';
  var el=document.getElementById('recordView');
  var h='<h3 style="margin-bottom:14px">📁 My Recordings</h3>';
  if(recordings.length===0)h+='<p style="color:#888;font-size:13px">No recordings yet. Start a practice session!</p>';
  else recordings.forEach(function(r,i){
    h+='<div class="record-item" onclick="playRecording('+i+')"><div class="title">'+r.topic+'</div><div class="meta">'+r.date+' | '+r.turns+' turns</div></div>';
  });
  h+='<button class="btn-main back-btn" onclick="backHome()" style="margin-top:14px">← Back</button>';
  el.innerHTML=h;
}

function playRecording(idx){
  var r=recordings[idx];
  if(!r)return;
  document.getElementById('recordView').style.display='none';
  document.getElementById('controls').style.display='block';
  document.getElementById('topicBar').style.display='block';
  document.getElementById('topicQ').textContent=r.topic;
  document.getElementById('topicD').textContent=r.answers?'Score: '+r.score+'%':'';
  document.getElementById('messages').innerHTML='<p style="color:#888;text-align:center;font-size:12px;margin-top:40px">🎮 Demo mode - recordings replay coming soon</p>';
}

// Settings
function showSettings(){
  document.getElementById('settingsModal').style.display='flex';
  document.getElementById('apiKeyInput').value=apiKey;
  checkKeyStatus();
}
function closeSettings(){document.getElementById('settingsModal').style.display='none'}
function saveKey(k){apiKey=k;localStorage.setItem('minimax_api_key',k);checkKeyStatus()}
function checkKeyStatus(){
  var el=document.getElementById('apiStatus');
  if(apiKey){el.textContent='✓ Saved';el.style.color='#27ae60';}
  else el.textContent='';
}
async function testKey(){
  var k=document.getElementById('apiKeyInput').value;
  var el=document.getElementById('apiStatus');
  if(!k){el.textContent='Enter key';el.style.color='#e74c3c';return;}
  el.textContent='Testing...';el.style.color='#888';
  try{
    var r=await fetch('https://api.minimaxi.com/v1/t2a_v2',{
      method:'POST',
      headers:{'Authorization':'Bearer '+k,'Content-Type':'application/json'},
      body:JSON.stringify({model:'speech-2.8-hd',text:'Testing',stream:false,output_format:'url',voice_setting:{voice_id:'Cantonese_GentleLady',speed:1,pitch:0},audio_setting:{sample_rate:32000,bitrate:128000,format:'mp3',channel:1}})
    });
    if(r.ok){el.textContent='✓ Works!';el.style.color='#27ae60';saveKey(k);}
    else{el.textContent='✗ Error '+r.status;el.style.color='#e74c3c';}
  }catch(e){el.textContent='✗ Network error';el.style.color='#e74c3c';}
}

// Event listeners
document.getElementById('randomBtn').onclick=startRandom;
document.getElementById('compBtn').onclick=startComp;
document.getElementById('mockBtn').onclick=startMock;
document.getElementById('recordingsBtn').onclick=showRecordings;
document.getElementById('sarahBtn').onclick=function(){playC('Sarah')};
document.getElementById('mikeBtn').onclick=function(){playC('Mike')};
document.getElementById('amyBtn').onclick=function(){playC('Amy')};
document.getElementById('micBtn').onmousedown=startRec;
document.getElementById('micBtn').onmouseup=stopRec;
document.getElementById('sendBtn').onclick=sendTxt;
document.getElementById('txtInput').onkeypress=function(e){if(e.key==='Enter')sendTxt()};
document.getElementById('pauseBtn').onclick=pauseRes;
document.getElementById('stopBtn').onclick=stopSpeak;
document.getElementById('settingsBtn').onclick=showSettings;
document.getElementById('closeSettingsBtn').onclick=closeSettings;
document.getElementById('testKeyBtn').onclick=testKey;
document.getElementById('apiKeyInput').onkeyup=function(e){saveKey(e.target.value)};

init();
</script>
