<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayo — DSE English Oral Practice</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#1a1a1a;color:#fff;min-height:100vh}
.header{background:linear-gradient(135deg,#667eea,#764ba2);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back-link{background:rgba(255,255,255,0.2);color:#fff;padding:5px 10px;border-radius:6px;text-decoration:none;font-size:12px}
.header h1{font-size:16px;font-weight:700}
.header .badge{background:rgba(255,255,255,0.2);padding:3px 8px;border-radius:10px;font-size:10px}
.header .settings{margin-left:auto;background:rgba(255,255,255,0.2);border:none;border-radius:6px;color:#fff;padding:5px 10px;cursor:pointer;font-size:12px}
.container{display:flex;height:calc(100vh - 50px)}
.sidebar{width:240px;background:#252525;border-right:1px solid #333;padding:12px;overflow-y:auto}
.sidebar h3{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.topic-card{background:#2d2d2d;border-radius:6px;padding:10px;margin-bottom:6px;cursor:pointer;border:2px solid transparent;transition:.2s}
.topic-card:hover{background:#363636}
.topic-card.active{border-color:#667eea;background:#2d3748}
.topic-card .cat{font-size:9px;color:#667eea;font-weight:600;margin-bottom:2px}
.topic-card .q{font-size:11px;color:#aaa;line-height:1.3}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topic-bar{background:#252525;padding:12px;border-bottom:1px solid #333;display:none}
.topic-bar .q{font-size:13px;font-weight:600;margin-bottom:6px}
.topic-bar .d{font-size:11px;color:#aaa;background:#1e1e1e;padding:6px 10px;border-radius:4px;border-left:3px solid #667eea}
.messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.avatar.sarah{background:linear-gradient(135deg,#3ba55c,#2d8a4e)}
.avatar.mike{background:linear-gradient(135deg,#f04747,#c73b3b)}
.avatar.amy{background:linear-gradient(135deg,#f47b67,#d65a4a)}
.avatar.you{background:linear-gradient(135deg,#667eea,#764ba2)}
.msg-body{flex:1}
.msg-header{display:flex;gap:5px;align-items:baseline;margin-bottom:2px}
.msg-header .name{font-weight:700;font-size:12px}
.msg-header .time{font-size:9px;color:#666}
.msg-body .text{font-size:12px;line-height:1.5;color:#ddd}
.controls{padding:12px;background:#1e1e1e;border-top:1px solid #333;display:none}
.cand-btns{display:flex;gap:5px;margin-bottom:8px}
.cand-btns button{flex:1;padding:7px;background:#333;border:none;border-radius:6px;color:#fff;cursor:pointer;font-size:11px;font-weight:600}
.cand-btns button:hover{background:#444}
.cand-btns button.sarah.active{background:#3ba55c}
.cand-btns button.mike.active{background:#f04747}
.cand-btns button.amy.active{background:#f47b67}
.mic-btn{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#ed4245,#c93b3b);border:none;color:#fff;font-size:20px;cursor:pointer;display:block;margin:0 auto;box-shadow:0 3px 10px rgba(237,66,69,0.3)}
.mic-btn:hover{transform:scale(1.05)}
.mic-btn.recording{animation:pulse .8s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(0.95)}}
.status{text-align:center;font-size:11px;color:#888;margin-top:6px}
.fallback{display:flex;gap:5px;margin-top:8px}
.fallback input{flex:1;padding:7px;border-radius:6px;border:1px solid #444;background:#2d2d2d;color:#fff;font-size:12px}
.fallback button{padding:7px 12px;background:#667eea;border:none;border-radius:6px;color:#fff;cursor:pointer}
.pause-row{display:flex;gap:5px;margin-top:6px}
.pause-row button{flex:1;padding:7px;background:#333;border:none;border-radius:6px;color:#fff;cursor:pointer;font-size:11px}
.pause-row button:disabled{opacity:0.5}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.welcome h2{font-size:22px;margin-bottom:8px}
.welcome p{color:#888;font-size:13px;max-width:320px;line-height:1.5;margin-bottom:16px}
.btn-main{padding:12px 24px;background:linear-gradient(135deg,#667eea,#764ba2);border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin:4px}
.btn-comp{background:linear-gradient(135deg,#e74c3c,#c0392b)}
.btn-mock{background:linear-gradient(135deg,#27ae60,#2ecc71)}
#comp-view,#mock-view{display:none;background:#1e1e1e;min-height:100%;padding:16px;overflow-y:auto}
.comp-art h3{color:#e74c3c;margin-bottom:4px;font-size:15px}
.comp-art .src{color:#888;font-size:10px;margin-bottom:12px}
.comp-art .txt{background:#2d2d2d;padding:14px;border-radius:8px;line-height:1.8;color:#ddd;font-size:13px;margin-bottom:14px;max-height:none;overflow:visible}
.comp-q{padding:10px}
.comp-q .qn{color:#e74c3c;font-size:11px;margin-bottom:6px}
.comp-q .qt{font-size:14px;font-weight:600;margin-bottom:12px}
.opt-btn{display:block;width:100%;padding:9px 12px;background:#333;border:2px solid #444;border-radius:8px;color:#fff;text-align:left;cursor:pointer;font-size:12px;margin-bottom:6px}
.opt-btn:hover{border-color:#667eea}
.opt-btn.correct{background:#27ae60;border-color:#27ae60}
.opt-btn.wrong{background:#c0392b;border-color:#c0392b}
.comp-res{text-align:center;padding:30px}
.comp-res h3{font-size:20px;margin-bottom:8px}
.comp-res .grade{font-size:44px;color:#e74c3c;margin:12px 0}
.comp-btn{padding:10px 20px;background:#e74c3c;border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;margin:4px}
.back-btn{background:#444}
.mock-hdr{text-align:center;padding:16px;background:linear-gradient(135deg,#27ae60,#2ecc71);border-radius:10px;margin-bottom:14px}
.mock-hdr h3{color:#fff;font-size:16px;margin-bottom:4px}
.mock-hdr p{color:rgba(255,255,255,0.85);font-size:11px}
.mock-timer{font-size:28px;font-weight:bold;color:#fff;margin:8px 0;font-family:monospace}
.mock-msgs{background:#2d2d2d;border-radius:10px;padding:12px;margin-bottom:12px;min-height:160px;max-height:50vh;overflow-y:auto}
.mock-msg{margin-bottom:8px;padding:7px 10px;background:#363636;border-radius:6px;font-size:12px}
.mock-msg .nm{font-weight:700;margin-right:6px}
.mock-msg.sarah .nm{color:#3ba55c}
.mock-msg.mike .nm{color:#f04747}
.mock-msg.amy .nm{color:#f47b67}
.mock-msg.ray .nm{color:#8e44ad}
.mock-msg .tx{color:#aaa}
#settings-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:100;align-items:center;justify-content:center}
.settings-box{background:#2d2d2d;padding:20px;border-radius:12px;max-width:360px;width:90%}
.settings-box h3{margin-bottom:14px;font-size:16px}
.settings-box label{display:block;font-size:11px;color:#888;margin-bottom:4px}
.settings-box input{width:100%;padding:8px;border-radius:6px;border:1px solid #444;background:#1a1a1a;color:#fff;font-size:12px}
.settings-box .hint{font-size:10px;color:#666;margin-top:3px}
.settings-box .status{font-size:10px;margin-top:3px}
.settings-box .status.ok{color:#27ae60}
.settings-box .status.err{color:#e74c3c}
.settings-row{display:flex;gap:6px;margin-top:12px}
.settings-row button{flex:1;padding:9px;background:#667eea;border:none;border-radius:6px;color:#fff;cursor:pointer}
.settings-row button.close{background:#444}
@media(max-width:700px){.sidebar{width:180px}}
@media(max-width:500px){.sidebar{width:100%;max-height:25vh;border-right:none;border-bottom:1px solid #333}.container{flex-direction:column}}
</style>
</head>
<body>
<div class="header">
<a href="../index.html" class="back-link">&larr; GameWorld</a>
<h1>🎓 Sayo — DSE Oral Practice</h1>
<span class="badge">FREE TTS/STT</span>
<button class="settings" onclick="showSettings()">⚙️</button>
</div>

<div class="container">
<div class="sidebar">
<h3>📚 Topics</h3>
<div id="topic-list"></div>
</div>

<div class="main">
<div class="topic-bar" id="topic-bar">
<div class="q" id="topic-q"></div>
<div class="d" id="topic-d"></div>
</div>

<div class="messages" id="messages"></div>

<div class="welcome" id="welcome">
<h2>🎤 DSE English Oral Practice</h2>
<p>Practice with 3 AI candidates. Speak or type your answers!</p>
<button class="btn-main" onclick="startRandom()">🎲 Random Topic</button>
<button class="btn-main btn-comp" onclick="startComp()">📖 Reading Comprehension</button>
<button class="btn-main btn-mock" onclick="startMock()">🎮 Watch Mock Exam</button>
</div>

<div class="controls" id="controls">
<div class="cand-btns">
<button class="sarah" onclick="playC('Sarah')">👤 Sarah</button>
<button class="mike" onclick="playC('Mike')">👤 Mike</button>
<button class="amy" onclick="playC('Amy')">👤 Amy</button>
</div>
<button class="mic-btn" id="mic-btn" onmousedown="startRec()" onmouseup="stopRec()" ontouchstart="startRec()" ontouchend="stopRec()">🎤</button>
<div class="status" id="status">Hold to record</div>
<div class="fallback">
<input type="text" id="txt-input" placeholder="Type your answer..." onkeypress="if(event.key==13)sendTxt()">
<button onclick="sendTxt()">Send</button>
</div>
<div class="pause-row">
<button id="pause-btn" onclick="pauseRes()" disabled>⏸️ Pause</button>
<button onclick="stopSpeak()">⏹️ Stop</button>
</div>
</div>

<div id="comp-view"></div>
<div id="mock-view"></div>
</div>
</div>

<div id="settings-modal">
<div class="settings-box">
<h3>⚙️ Settings</h3>
<div>
<label>MiniMax API Key (better TTS)</label>
<input type="password" id="api-key" placeholder="Enter MiniMax API Key">
<div class="hint">platform.minimax.io &rarr; API Keys</div>
<div class="status" id="api-status"></div>
</div>
<div class="settings-row">
<button onclick="testKey()">Test</button>
<button class="close" onclick="closeSettings()">Close</button>
</div>
</div>
</div>

<script>
// ==================== TOPICS ====================
var TOPICS=[
{id:101,cat:"📌 REAL DSE 2026",q:"Financial literacy should be taught in all secondary schools in Hong Kong. To what extent do you agree?",d:"Only 30% of HK teens understand budgeting."},
{id:102,cat:"📌 REAL DSE 2026",q:"Online dishonesty has become a serious problem. How can we address this?",d:"45% of HK university students admitted plagiarizing."},
{id:103,cat:"📌 REAL DSE 2026",q:"Hong Kong's street food culture is disappearing. Is this a significant loss?",d:"Over 50 famous dai pai dongs closed in a decade."},
{id:104,cat:"📌 REAL DSE 2026",q:"Autonomous vehicles should be introduced in Hong Kong. Do you agree?",d:"Self-driving taxis operate globally. HK's dense traffic poses challenges."},
{id:105,cat:"📌 REAL DSE 2026",q:"Hong Kong should increase minimum wage for catering workers. To what extent do you agree?",d:"Catering workers earn ~HK$50/hour."},
{id:201,cat:"📌 REAL DSE 2026",q:"AI tools like ChatGPT should be allowed in homework. To what extent do you agree?",d:"Educators worry about loss of critical thinking."},
{id:202,cat:"📌 REAL DSE 2026",q:"AI will eventually replace most human jobs. Do you agree?",d:"AI could automate 30% of jobs by 2030."},
{id:203,cat:"📌 REAL DSE 2026",q:"Tipping should become widespread in Hong Kong. Do you agree?",d:"Some restaurants added service charges."},
{id:204,cat:"📌 REAL DSE 2026",q:"Hong Kong's country parks should be better promoted. How can this be done?",d:"Country parks cover 40% of HK land."},
{id:205,cat:"📌 REAL DSE 2026",q:"Home remedies should be more widely accepted in Hong Kong. Discuss.",d:"TCM is popular. Some remedies controversial."},
{id:206,cat:"📌 REAL DSE 2026",q:"Young people in Hong Kong should consider working in the Greater Bay Area. Agree?",d:"GBA includes 9 cities. Opportunities growing."},
{id:301,cat:"📝 Practice",q:"Computers will replace teachers in classrooms. Agree?",d:"E-learning grew 300% post-pandemic."},
{id:2,cat:"📝 Practice",q:"Social media has negative impact on teenagers' mental health. Do you agree?",d:"70% of HK teens spend 3+ hours daily on social media."},
{id:3,cat:"📝 Practice",q:"Young people should prioritize careers over starting a family. Discuss.",d:"Avg marriage age: 31M/29F."},
{id:4,cat:"📝 Practice",q:"Hong Kong should ban single-use plastics completely. Do you agree?",d:"HK generates 2,000+ tonnes plastic waste daily."},
{id:5,cat:"📝 Practice",q:"University education should be free for all students. Discuss.",d:"HK university costs avg HK$50,000/year."},
{id:6,cat:"📝 Practice",q:"Schools should require students to participate in at least one sport. Agree?",d:"Only 30% of HK students meet daily activity guidelines."},
{id:7,cat:"📝 Practice",q:"AI will create more problems than it solves. Do you agree?",d:"AI could automate 30% of jobs."},
{id:8,cat:"📝 Practice",q:"Traditional festivals are becoming less meaningful. Discuss.",d:"60% of young HK people find traditions outdated."},
{id:9,cat:"📝 Practice",q:"Homework should be abolished in primary schools. Do you agree?",d:"70% of primary students spend 2+ hours on homework daily."},
{id:10,cat:"📝 Practice",q:"Living in Hong Kong is becoming unaffordable for young people. Discuss.",d:"HK apartments cost 20x annual salary."},
{id:11,cat:"📝 Practice",q:"Employees should work from home permanently. Agree?",d:"Remote work increased 400% during pandemic."},
{id:12,cat:"📝 Practice",q:"Junk food advertising should be banned during children's TV programmes.",d:"30% of HK children overweight."},
{id:13,cat:"📝 Practice",q:"Online anonymity is more harmful than beneficial. Discuss.",d:"40% of HK internet users experienced harassment."},
{id:14,cat:"📝 Practice",q:"Learning a second language should start from primary school. Agree?",d:"Children learning before 10 show 40% better fluency."},
{id:15,cat:"📝 Practice",q:"The government should provide more support for elderly care. Discuss.",d:"Elderly (65+) will reach 33% by 2040."}
];

// ==================== COMP ARTICLES ====================
var COMP=[
{id:501,title:"AI Education in Hong Kong Schools",src:"SCMP",art:"Hong Kong authorities will offer HK$500,000 to each public school for AI funding. Schools must implement AI in at least 3 subjects and develop 6 teaching examples. Students can use AI tools with supervision.",qs:[
{q:"What is the purpose of the HK$500 million?",o:["Build schools","Promote AI in classrooms","Pay teachers","Buy textbooks"],a:1},
{q:"How many subjects must schools implement AI in?",o:["One","Two","At least three","At least six"],a:2},
{q:"The word 'allocate' means:",o:["Spend","Distribute","Save","Borrow"],a:1},
{q:"What must schools develop?",o:["Curriculum","6 teaching examples","Training programs","Research"],a:1}
]},
{id:502,title:"Students and AI Homework",src:"SCMP",art:"Nearly one in four HK students cannot complete homework without AI. 71% of teachers reported students using AI tools. Some say AI literacy is essential, but teachers worry about over-reliance.",qs:[
{q:"What proportion cannot complete homework without AI?",o:["1 in 10","1 in 4","1 in 2","3 in 4"],a:1},
{q:"What % of teachers reported AI use?",o:["55%","71%","80%","90%"],a:1},
{q:"The word 'grapple' means:",o:["Ignore","Struggle with","Accept","Celebrate"],a:1},
{q:"What concern do teachers have?",o:["AI is expensive","Students lack devices","Over-reliance hinders thinking","Parents refuse AI"],a:2}
]},
{id:503,title:"Digital Divide and Ethnic Minorities",src:"SCMP",art:"Researchers from HKU surveyed 412 ethnic minority people. Only 55% found government apps user-friendly. The EOC urges using AI for language support.",qs:[
{q:"How many people were surveyed?",o:["212","412","515","550"],a:1},
{q:"What % found apps user-friendly?",o:["45%","55%","65%","75%"],a:1},
{q:"'Bridge language barriers' means:",o:["Create languages","Help communicate across languages","Build bridges","Learn languages"],a:1},
{q:"What does EOC suggest using AI for?",o:["Entertainment","Language support","Shopping","Social media"],a:1}
]},
{id:504,title:"France Bans Social Media for Minors",src:"CNN 10",art:"France has proposed a law to ban minors from social media. The government says it aims to protect young people from online harassment. Critics argue it may violate rights and limit access to information.",qs:[
{q:"What has France proposed?",o:["Tax social media","Ban for minors","Mandatory education","New registration"],a:1},
{q:"What is the stated purpose?",o:["Increase revenue","Protect young people","Create jobs","Reduce data use"],a:1},
{q:"What do critics say?",o:["Too expensive","May violate rights","Unnecessary","Too strict"],a:1},
{q:"What would the law require?",o:["School registration","Age verification","Monthly payments","Government approval"],a:1}
]},
{id:505,title:"NASA's Artemis Moon Mission",src:"CNN 10",art:"NASA has launched the Artemis 2 mission, marking a significant step toward returning humans to the Moon. The mission aims to establish a sustainable presence and eventually support future Mars missions.",qs:[
{q:"What is the name of NASA's mission?",o:["Apollo 2","Artemis 2","Luna 2","Moon 2"],a:1},
{q:"What is the ultimate goal?",o:["Space tourism","Support Mars missions","Mine resources","Study the Sun"],a:1},
{q:"What will astronauts do?",o:["Build homes","Conduct experiments","Train for Mars","Launch satellites"],a:1},
{q:"'Sustainable presence' means:",o:["Temporary visit","Long-term support","One-time visit","Military base"],a:1}
]}
];

// ==================== STATE ====================
var curTopic=null,isRec=false,rec=null,synth=window.speechSynthesis,curAudio=null,isPaused=false;
var apiKey=localStorage.getItem('minimax_api_key')||'';
var VOICES={'Sarah':{r:.95,p:1.1,v:null},'Mike':{r:1.1,p:.9,v:null},'Amy':{r:.9,p:1.2,v:null}};

// ==================== INIT ====================
function init(){
  renderTopics();
  var v=synth.getVoices();
  if(v.length>0)loadVoices(v);
  synth.onvoiceschanged=function(){loadVoices(synth.getVoices())};
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){rec=new SR();rec.continuous=false;rec.interimResults=true;rec.lang='en-US';
    rec.onresult=function(e){
      var fin='',int='';
      for(var i=e.resultIndex;i<e.results.length;i++){
        var t=e.results[i][0].transcript;
        if(e.results[i].isFinal)fin+=t;else int+=t;
      }
      document.getElementById('status').textContent=int||'Processing...';
      if(fin){addMsg('you',fin);synthResp(fin);}
    };
    rec.onerror=function(){document.getElementById('status').textContent='Try again...';};
    rec.onend=function(){isRec=false;document.getElementById('mic-btn').classList.remove('recording');};
  }
  if(apiKey)document.getElementById('api-key').value=apiKey;
}
function loadVoices(v){
  var en=v.filter(function(x){return x.lang.startsWith('en')});
  var base=en.length>0?en:v;
  VOICES.Sarah.v=base.find(function(x){return x.name.includes('Female')})||base[0];
  VOICES.Mike.v=base.find(function(x){return x.name.includes('Male')})||base[1]||base[0];
  VOICES.Amy.v=base.find(function(x){return x.name.includes('Female')})||base[0];
}

// ==================== TOPICS ====================
function renderTopics(){
  var el=document.getElementById('topic-list');
  el.innerHTML='';
  TOPICS.forEach(function(t){
    var div=document.createElement('div');
    div.className='topic-card';
    div.innerHTML='<div class="cat">'+t.cat+'</div><div class="q">'+t.q.substring(0,60)+'...</div>';
    div.onclick=function(){selectTopic(t)};
    el.appendChild(div);
  });
}
function startRandom(){selectTopic(TOPICS[Math.floor(Math.random()*TOPICS.length)])}
function selectTopic(t){
  curTopic=t;
  document.getElementById('welcome').style.display='none';
  document.getElementById('controls').style.display='block';
  document.getElementById('topic-bar').style.display='block';
  document.getElementById('comp-view').style.display='none';
  document.getElementById('mock-view').style.display='none';
  document.getElementById('topic-q').textContent=t.q;
  document.getElementById('topic-d').textContent=t.d;
  document.getElementById('messages').innerHTML='';
  TOPICS.forEach(function(x,i){x.id===t.id?divs[i].classList.add('active'):null});
  setTimeout(function(){playC('Sarah')},500);
}

// ==================== MESSAGES ====================
function addMsg(speaker,text){
  var div=document.createElement('div');
  div.className='msg';
  div.innerHTML='<div class="avatar '+speaker.toLowerCase()+'">'+speaker[0].toUpperCase()+'</div><div class="msg-body"><div class="msg-header"><span class="name">'+speaker+'</span><span class="time">'+new Date().toLocaleTimeString()+'</span></div><div class="text">'+text+'</div></div>';
  document.getElementById('messages').appendChild(div);
  document.getElementById('messages').scrollTop=99999;
}

// ==================== TTS ====================
async function speak(text,cand,onEnd){
  if(apiKey&&apiKey.length>10){
    return new Promise(async function(res){
      var voices={'Sarah':'Cantonese_GentleLady','Mike':'Cantonese_PlayfulMan','Amy':'male-qn-qingse'};
      var cfg={'Sarah':{s:1,p:0},'Mike':{s:1.1,p:2},'Amy':{s:.95,p:1}};
      var v=voices[cand]||'Cantonese_GentleLady';
      var c=cfg[cand]||{s:1,p:0};
      try{
        var resp=await fetch('https://api.minimaxi.com/v1/t2a_v2',{
          method:'POST',
          headers:{'Authorization':'Bearer '+apiKey,'Content-Type':'application/json'},
          body:JSON.stringify({model:'speech-2.8-hd',text:text,stream:false,output_format:'url',voice_setting:{voice_id:v,speed:c.s,pitch:c.p},audio_setting:{sample_rate:32000,bitrate:128000,format:'mp3',channel:1}})
        });
        if(resp.ok){
          var data=await resp.json();
          var url=data.data&&data.data.audio;
          if(url){
            var audio=new Audio(url);
            audio.onended=function(){if(onEnd)onEnd();res()};
            audio.onerror=function(){if(onEnd)onEnd();res()};
            curAudio=audio;isSpeaking=true;
            updatePauseBtn();
            audio.play();
            return;
          }
        }
      }catch(e){console.error('TTS err',e)}
      fallbackTTS(text,cand,onEnd,res);
    });
  }else{
    fallbackTTS(text,cand,onEnd);
  }
}
function fallbackTTS(text,cand,onEnd,res){
  synth.cancel();isPaused=false;
  var u=new SpeechSynthesisUtterance(text);
  var v=VOICES[cand];
  u.voice=v.v;u.rate=v.r;u.pitch=v.p;
  curAudio=u;isSpeaking=true;
  u.onend=function(){curAudio=null;if(onEnd)onEnd();if(res)res()};
  u.onerror=function(){curAudio=null;if(onEnd)onEnd();if(res)res()};
  synth.speak(u);
  updatePauseBtn();
  if(res)res();
}
function pauseRes(){
  if(curAudio&&curAudio.pause){
    if(isPaused){curAudio.play();isPaused=false;}
    else{curAudio.pause();isPaused=true;}
    updatePauseBtn();
  }
}
function stopSpeak(){
  if(curAudio&&curAudio.pause){curAudio.pause();curAudio.currentTime=0;}
  else synth.cancel();
  curAudio=null;isSpeaking=false;isPaused=false;updatePauseBtn();
}
function updatePauseBtn(){
  var btn=document.getElementById('pause-btn');
  if(!curAudio){btn.textContent='⏸️ Pause';btn.disabled=true;}
  else{btn.disabled=false;btn.textContent=isPaused?'▶️ Resume':'⏸️ Pause';}
}

async function playC(name){if(isSpeaking)return;
  var btn=document.querySelector('.cand-btns .'+name.toLowerCase());
  btn.classList.add('active');
  var prompts={
    'Sarah':'Hello everyone, I am Sarah. Let us start discussing. '+(curTopic?curTopic.q:'')+' What do you all think?',
    'Mike':'I am Mike. I have some thoughts on this topic. '+(curTopic?curTopic.q:'')+' Let me share my perspective.',
    'Amy':'Hi, I am Amy. I agree with what has been said. '+(curTopic?curTopic.q:'')+' Let me add some points.'
  };
  addMsg(name,prompts[name]);
  await speak(prompts[name],name,function(){btn.classList.remove('active');document.getElementById('status').textContent='Your turn';});
}

// ==================== AI RESPONSE ====================
async function synthResp(text){if(isSpeaking)return;
  document.getElementById('status').textContent='Thinking...';
  await new Promise(function(r){setTimeout(r,600)});
  var tx=text.toLowerCase();
  var isAgree=/\b(agree|yes|support|true|good|right|definitely)\b/.test(tx);
  var isDisagree=/\b(disagree|no|not|wrong|against|false)\b/.test(tx);
  var isAI=/\b(ai|robot|chatgpt|technology)\b/.test(tx);
  var isYouth=/\b(young|teenager|student|youth|school|children)\b/.test(tx);
  var isMoney=/\b(money|cost|salary|wage|pay|afford)\b/.test(tx);

  var resp;
  if(isAI){
    resp={'Sarah':["AI is transforming the workplace. But will this benefit everyone equally?","The data shows interesting trends. What sectors would be most affected?","How can we ensure workers are properly retrained?"],
      'Mike':["But what happens to workers who cannot adapt quickly enough?","I am worried this could increase inequality.","What about middle-skilled workers who get squeezed out?"],
      'Amy':["And AI can help small businesses compete with larger ones.","With proper training, many workers could benefit.","The key is distributing benefits more broadly."]};
  }else if(isYouth){
    resp={'Sarah':["Education is fundamental. What curriculum changes are needed?","How can schools balance achievement with life skills?","Young people face unique pressures. What support do they need most?"],
      'Mike':["I am concerned about student pressure. Are we creating unrealistic expectations?","What about students who do not fit the traditional model?","Does more testing lead to better outcomes?"],
      'Amy':["Holistic development is as important as academic results.","Schools should focus on mental health and emotional intelligence.","We should celebrate different types of success."]};
  }else if(isAgree){
    resp={'Sarah':["That is an excellent point. Let me add that we should consider the long-term implications.","Could you elaborate on how this would work in practice?"],
      'Mike':["I understand where you are coming from, but let me offer a different angle.","Fair point, but what about implementation challenges?"],
      'Amy':["I completely agree! This would help many people in our community.","Exactly! It reminds me of how other places have done this successfully."]};
  }else if(isDisagree){
    resp={'Sarah':["That is a valid alternative perspective. Could you share more about your view?"],
      'Mike':["I hear your concerns, but I have doubts. Can you provide more evidence?","I am skeptical. What about unintended consequences?"],
      'Amy':["I hear your concerns, but I still believe there is merit in this approach.","What would change your mind about this?"]};
  }else{
    resp={'Sarah':["That is an interesting perspective. Could you tell us more about your reasoning?","Let me think about this from different angles. What would be the biggest challenge?"],
      'Mike':["I am not entirely convinced. What evidence supports this view?","That is one perspective, but I have questions about the practicality."],
      'Amy':["I think that is a lovely idea! It would really help many people.","I agree with parts of what you said. Let me add another consideration."]};
  }

  var c=['Sarah','Mike','Amy'][Math.floor(Math.random()*3)];
  if(isDisagree&&Math.random()>.4)c='Mike';
  if(isAgree&&Math.random()>.4)c='Amy';
  var pool=resp[c];
  var r=pool[Math.floor(Math.random()*pool.length)];
  addMsg(c,r);
  document.getElementById('status').textContent='Your turn';
  await speak(r,c);
}

// ==================== STT ====================
function startRec(){
  if(!rec){document.getElementById('status').textContent='Not supported';return;}
  isRec=true;
  document.getElementById('mic-btn').classList.add('recording');
  document.getElementById('status').textContent='Listening...';
  rec.start();
}
function stopRec(){
  if(!isRec)return;
  isRec=false;
  document.getElementById('mic-btn').classList.remove('recording');
  document.getElementById('status').textContent='Processing...';
  rec.stop();
}
function sendTxt(){
  var el=document.getElementById('txt-input');
  var txt=el.value.trim();

  el.value='';

}

// ==================== COMPREHENSION ====================
var curComp=null,compQ=0,compScore=0;
function startComp(){
  document.getElementById('welcome').style.display='none';
  document.getElementById('controls').style.display='none';
  document.getElementById('topic-bar').style.display='none';
  document.getElementById('mock-view').style.display='none';
  document.getElementById('comp-view').style.display='block';
  curComp=COMP[Math.floor(Math.random()*COMP.length)];
  compQ=0;compScore=0;
  showCompArt();
}
function showCompArt(){
  var v=document.getElementById('comp-view');
  v.innerHTML='<div class="comp-art"><h3>'+curComp.title+'</h3><p class="src">Source: '+curComp.src+'</p><div class="txt">'+curComp.art+'</div><button class="btn-main" onclick="showCompQ()">Start Questions</button><br><button class="btn-main back-btn" onclick="backHome()">Back</button></div>';
}
function showCompQ(){
  var q=curComp.qs[compQ];
  var tot=curComp.qs.length;
  var h='<div class="comp-q"><p class="qn">Question '+(compQ+1)+' of '+tot+'</p><p class="qt">'+q.q+'</p>';
  q.o.forEach(function(opt,i){
    h+='<button class="opt-btn" onclick="checkAns('+i+')">'+String.fromCharCode(65+i)+'. '+opt+'</button>';
  });
  h+='</div>';
  document.getElementById('comp-view').innerHTML=h;
}
function checkAns(sel){
  var correct=curComp.qs[compQ].a;
  document.querySelectorAll('.opt-btn').forEach(function(btn,i){
    btn.disabled=true;
    if(i===correct)btn.classList.add('correct');
    if(i===sel&&sel!==correct)btn.classList.add('wrong');
  });
  if(sel===correct)compScore++;
  setTimeout(function(){
    compQ++;
    if(compQ<curComp.qs.length)showCompQ();
    else showCompRes();
  },1200);
}
function showCompRes(){
  var tot=curComp.qs.length;
  var pct=Math.round((compScore/tot)*100);
  var grade=pct>=80?'A':pct>=60?'B':pct>=40?'C':'D';
  var h='<div class="comp-res"><h3>Result: '+compScore+'/'+tot+' ('+pct+'%)</h3><p class="grade">Grade: <strong>'+grade+'</strong></p><button class="comp-btn" onclick="startComp()">Try Another</button><button class="comp-btn back-btn" onclick="backHome()">Back to Home</button></div>';
  document.getElementById('comp-view').innerHTML=h;
}
function backHome(){
  document.getElementById('comp-view').style.display='none';
  document.getElementById('mock-view').style.display='none';
  document.getElementById('welcome').style.display='flex';
}

// ==================== MOCK EXAM ====================
var MOCK_TOPICS=[
{q:"Financial literacy should be taught in all secondary schools. To what extent do you agree?",d:"Only 30% of HK teens understand budgeting."},
{q:"Online dishonesty has become a serious problem. How can we address this?",d:"45% of HK university students admitted plagiarizing."},
{q:"Hong Kong's street food culture is disappearing. Is this a significant loss?",d:"Over 50 famous dai pai dongs closed in a decade."}
];
var MOCK_SCRIPT=[
{c:'Sarah',t:'Hello everyone, I am Sarah. Let us start discussing. Financial literacy should be taught in all secondary schools. What do you all think?'},
{c:'Mike',t:'I am Mike. I disagree. I think financial literacy is too complex for secondary students. They should focus on basic maths first.'},
{c:'Amy',t:'I agree with Sarah. Many students do not understand budgeting. Starting with simple topics like saving pocket money would help.'},
{c:'Ray',t:'I partially agree. Some topics like saving are suitable, but stock market investing might be too advanced.'},
{c:'Sarah',t:'That is a good point. We should consider age-appropriate content. Younger students could learn basic saving, older students could tackle investing.'},
{c:'Mike',t:'But where would the teachers come from? Most teachers are not qualified to teach financial topics. This is a major challenge.'},
{c:'Amy',t:'I agree with Mike on that point. We would need proper teacher training programs.'},
{c:'Ray',t:'I think government support is crucial. The HK$500 million allocation could fund teacher training programs.'},
{c:'Sarah',t:'To summarize, we agreed that financial education is important. We suggested starting with basic topics and providing teacher training. Thank you everyone!'}
];
var mockRunning=false;var mockPaused=false;;var mockPaused=false;,mockIdx=0,mockStart=0,mockTO=null;

function startMock(){
  document.getElementById('welcome').style.display='none';
  document.getElementById('controls').style.display='none';
  document.getElementById('topic-bar').style.display='none';
  document.getElementById('comp-view').style.display='none';
  document.getElementById('mock-view').style.display='block';
  var topic=MOCK_TOPICS[Math.floor(Math.random()*MOCK_TOPICS.length)];
  var hdr='<div class="mock-hdr"><h3>🎮 DSE Oral Mock Exam</h3><p>4 AI Candidates • 8-Minute Group Discussion</p><div class="mock-timer" id="mock-timer">00:00 / 08:00</div><p style="font-size:12px;font-weight:bold;margin-top:8px;">📝 '+topic.q+'</p><p style="font-size:10px;opacity:0.8;margin-top:4px;">📊 '+topic.d+'</p></div><div class="mock-msgs" id="mock-msgs"></div><div style="text-align:center;padding:10px;"><button class="btn-main" style="background:#444;padding:8px 16px;font-size:12px;" onclick="stopMock()">⏹ Stop</button><br><button class="btn-main back-btn" style="padding:8px 16px;font-size:12px;margin-top:6px;" onclick="backHome()">← Back to Home</button></div>';
  document.getElementById('mock-view').innerHTML=hdr;
  mockRunning=true;mockIdx=0;mockStart=Date.now();
  runMockTurn();
  updateMockTimer();
}

function runMockTurn(){
  if(!mockRunning||mockPaused||mockIdx>=MOCK_SCRIPT.length){return;}
  var turn=MOCK_SCRIPT[mockIdx];
  var msgs=document.getElementById('mock-msgs');
  var colors={Sarah:'#3ba55c',Mike:'#f04747',Amy:'#f47b67',Ray:'#8e44ad'};
  var div=document.createElement('div');
  div.className='mock-msg '+turn.c.toLowerCase();
  div.innerHTML='<span class="nm" style="color:'+colors[turn.c]+'">'+turn.c+':</span> <span class="tx">'+turn.t+'</span>';
  msgs.appendChild(div);
  msgs.scrollTop=msgs.scrollHeight;
  speak(turn.t,turn.c,function(){});
  mockIdx++;
  mockTO=setTimeout(runMockTurn,12000);
}

function updateMockTimer(){
  if(!mockRunning)return;
  var elapsed=Date.now()-mockStart;
  var secs=Math.floor(elapsed/1000);
  var mins=Math.floor(secs/60);
  var ss=secs%60;
  var el=document.getElementById('mock-timer');
  if(el)el.textContent=(mins<10?'0':'')+mins+':'+(ss<10?'0':'')+ss+' / 08:00';
  setTimeout(updateMockTimer,1000);
}

function endMock(){
  if(!mockRunning)return;
  mockRunning=false;
  stopSpeak();
  clearTimeout(mockTO);
  var msgs=document.getElementById('mock-msgs');
  if(msgs)msgs.innerHTML+='<div style="text-align:center;padding:12px;background:#27ae60;border-radius:8px;margin-top:10px;color:#fff;"><strong>✅ Mock Exam Complete!</strong><br><span style="font-size:11px;opacity:0.9">In a real exam, you would participate as the 4th candidate!</span></div>';
}

function stopMock(){
  if(mockPaused){
    mockPaused=false;
    mockRunning=true;
    runMockTurn();
    updateMockTimer();
  } else {
    mockPaused=true;
    mockRunning=false;
    clearTimeout(mockTO);
    stopSpeak();
  }
}

function showSettings(){
  document.getElementById('settings-modal').style.display='flex';
  document.getElementById('api-key').value=apiKey;
  checkKeyStatus();
}
function closeSettings(){document.getElementById('settings-modal').style.display='none'}
function saveKey(k){apiKey=k;localStorage.setItem('minimax_api_key',k);checkKeyStatus()}
function checkKeyStatus(){
  var el=document.getElementById('api-status');
  if(apiKey){el.textContent='✓ Saved';el.className='status ok';}
  else{el.textContent='';el.className='status';}
}
async function testKey(){
  var k=document.getElementById('api-key').value;
  var el=document.getElementById('api-status');
  if(!k){el.textContent='Please enter a key';el.className='status err';return;}
  el.textContent='Testing...';el.className='status';
  try{
    var resp=await fetch('https://api.minimaxi.com/v1/t2a_v2',{
      method:'POST',
      headers:{'Authorization':'Bearer '+k,'Content-Type':'application/json'},
      body:JSON.stringify({model:'speech-2.8-hd',text:'Testing',stream:false,output_format:'url',voice_setting:{voice_id:'Cantonese_GentleLady',speed:1,pitch:0},audio_setting:{sample_rate:32000,bitrate:128000,format:'mp3',channel:1}})
    });
    if(resp.ok){el.textContent='✓ Works!';el.className='status ok';saveKey(k);}
    else{el.textContent='✗ Error: '+resp.status;el.className='status err';}
  }catch(e){el.textContent='✗ Network error';el.className='status err';}
}
document.getElementById('api-key').addEventListener('keyup',function(e){saveKey(e.target.value)});

init();
