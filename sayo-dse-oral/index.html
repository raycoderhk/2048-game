// Init
function init(){
  renderTopics();

  if(v.length>0)loadVoices(v);
  synth.onvoiceschanged=function(){loadVoices(synth.getVoices())};
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){
    rec=new SR();
    rec.continuous=false;
    rec.interimResults=true;
    rec.lang='en-US';
    rec.onresult=function(e){
      var fin='',int='';
      for(var i=e.resultIndex;i<e.results.length;i++){
        var t=e.results[i][0].transcript;
        if(e.results[i].isFinal)fin+=t;else int+=t;
      }
      document.getElementById('status').textContent=int||'Processing...';
      if(fin){addMsg('you',fin);synthResp(fin);}
    };
    rec.onerror=function(){document.getElementById('status').textContent='Try again...';};
    rec.onend=function(){isRec=false;document.getElementById('micBtn').classList.remove('recording');};
  }
  document.getElementById('apiKeyInput').value=apiKey;
  checkKeyStatus();
}

function loadVoices(v){
  var en=v.filter(function(x){return x.lang.startsWith('en')});
  var base=en.length>0?en:v;
  VOICES.Sarah.v=base.find(function(x){return x.name.includes('Female')})||base[0];
  VOICES.Mike.v=base.find(function(x){return x.name.includes('Male')})||base[1]||base[0];
  VOICES.Amy.v=base.find(function(x){return x.name.includes('Female')})||base[0];
}

// TTS
async function speak(text,cand,onEnd){
  if(isSpeaking){if(onEnd)onEnd();return;}
  if(apiKey&&apiKey.length>10){
    return new Promise(function(res){
      var voices={'Sarah':'Cantonese_GentleLady','Mike':'Cantonese_PlayfulMan','Amy':'male-qn-qingse'};
      var cfg={'Sarah':{s:1,p:0},'Mike':{s:1.1,p:2},'Amy':{s:.95,p:1}};
      var v=voices[cand]||'Cantonese_GentleLady';
      var c=cfg[cand]||{s:1,p:0};
      var maxRetries=3;
      var delay=500;
      function tryTTS(attempt){
        fetch('https://api.minimaxi.com/v1/t2a_v2',{
          method:'POST',
          headers:{'Authorization':'Bearer '+apiKey,'Content-Type':'application/json'},
          body:JSON.stringify({model:'speech-2.8-hd',text:text,stream:false,output_format:'url',voice_setting:{voice_id:v,speed:c.s,pitch:c.p},audio_setting:{sample_rate:32000,bitrate:128000,format:'mp3',channel:1}})
        }).then(function(resp){
          if(!resp.ok && resp.status===529 && attempt<maxRetries){
            // 529: server overloaded, retry with backoff
            setTimeout(function(){tryTTS(attempt+1);},delay);
            delay*=2;return;
          }
          return resp.json();
        }).then(function(data){
          if(!data){return;} // was retrying
          var url=data.data&&data.data.audio;
          if(url){
            var audio=new Audio(url);
            audio.onended=function(){isSpeaking=false;if(onEnd)onEnd();res()};
            audio.onerror=function(){isSpeaking=false;if(onEnd)onEnd();res()};
            curAudio=audio;isSpeaking=true;
            updatePauseBtn();
            audio.play();
            return;
          }
          fallbackTTS(text,cand,onEnd,res);
        }).catch(function(){
          if(attempt<maxRetries){
            setTimeout(function(){tryTTS(attempt+1);},delay);
            delay*=2;
          }else{
            fallbackTTS(text,cand,onEnd,res);
          }
        });
      }
      tryTTS(0);
    });
  }else{
    return new Promise(function(res){
      fallbackTTS(text,cand,onEnd,res);
    });
  }
}


function fallbackTTS(text,cand,onEnd,res){
  synth.cancel();isPaused=false;
  var u=new SpeechSynthesisUtterance(text);
  var v=VOICES[cand];
  u.voice=v.v;u.rate=v.r;u.pitch=v.p;
  curAudio=u;isSpeaking=true;
  u.onend=function(){isSpeaking=false;if(onEnd)onEnd();if(res)res()};
  u.onerror=function(){isSpeaking=false;if(onEnd)onEnd();if(res)res()};
  synth.speak(u);
  updatePauseBtn();
  if(res)res();
}

function pauseRes(){
  if(!curAudio)return;
  if(isPaused){curAudio.play?curAudio.play():synth.resume();isPaused=false;}
  else {if(curAudio.pause)curAudio.pause();isPaused=true;}
  updatePauseBtn();
}

function stopSpeak(){
  if(curAudio&&curAudio.pause){curAudio.pause();curAudio.currentTime=0;}
  else synth.cancel();
  curAudio=null;isSpeaking=false;isPaused=false;updatePauseBtn();
}

function updatePauseBtn(){
  var btn=document.getElementById('pauseBtn');
  if(!curAudio){btn.textContent='⏸️ Pause';btn.disabled=true;}
  else{btn.disabled=false;btn.textContent=isPaused?'▶️ Resume':'⏸️ Pause';}
}

// Candidates
async function playC(name){
  if(isSpeaking)return;
  var btn=document.getElementById(name.toLowerCase()+'Btn');
  btn.classList.add('active');
  var prompts={
    'Sarah':'Hello everyone, I am Sarah. Let us start discussing. '+(curTopic?curTopic.q:'')+' What do you all think?',
    'Mike':'I am Mike. I have some thoughts on this topic. '+(curTopic?curTopic.q:'')+' Let me share my perspective.',
    'Amy':'Hi, I am Amy. I agree with what has been said. '+(curTopic?curTopic.q:'')+' Let me add some points.'
  };
  addMsg(name,prompts[name]);
  await speak(prompts[name],name,function(){btn.classList.remove('active');document.getElementById('status').textContent='Your turn';});
}

// AI Response
async function synthResp(text){
  if(isSpeaking)return;
  document.getElementById('status').textContent='Thinking...';
  await new Promise(function(r){setTimeout(r,600)});
  var tx=text.toLowerCase();
  var isAgree=/\b(agree|yes|support|true|good|right|definitely)\b/.test(tx);
  var isDisagree=/\b(disagree|no|not|wrong|against|false)\b/.test(tx);
  var isAI=/\b(ai|robot|chatgpt|technology)\b/.test(tx);
  var isYouth=/\b(young|teenager|student|youth|school|children)\b/.test(tx);
  var isMoney=/\b(money|cost|salary|wage|pay|afford)\b/.test(tx);

  var resp;
  if(isAI){
    resp={'Sarah':["AI is transforming education. But will this benefit every student equally?","The data shows interesting trends in adoption. What sectors would be most affected?","How can we ensure teachers are properly trained for AI tools?"],
      'Mike':["But what happens to students who cannot access AI tools at home?","I am worried about increased inequality in education.","What about over-reliance on technology in learning?"],
      'Amy':["AI can help students with special educational needs significantly.","With proper guidance, AI could revolutionize personalized learning.","The key is balanced integration, not replacement."]};
  }else if(isYouth||isMoney){
    resp={'Sarah':["Education and financial issues are fundamental life skills. But how do we balance academic pressure with practical learning?","What curriculum changes would help address these concerns effectively?","Young people face real challenges in these areas. How can schools adapt?"],
      'Mike':["I am concerned about fairness and accessibility for all students.","What about students from lower-income families?","Practical solutions need to consider everyone equally."],
      'Amy':["These are essential life skills that schools should prioritize genuinely.","We need policies that actually help, not just look good on paper.","Affordable and accessible solutions are key for real impact."]};
  }else if(isAgree){
    resp={'Sarah':["That is an excellent point. Let me add that we should consider long-term implications.","Could you elaborate on how this would work in practice? We need concrete implementation steps."],
      'Mike':["I understand your perspective, but let me offer another angle for consideration.","Fair point, but implementation challenges still concern me deeply."],
      'Amy':["I completely agree! This would benefit many people in meaningful ways.","Exactly! It is refreshing to hear different viewpoints on this."]};
  }else if(isDisagree){
    resp={'Sarah':["That is a valid alternative perspective worth considering carefully.","What specific evidence supports your view?"],
      'Mike':["I hear your concerns, but have you considered the unintended consequences?","I am skeptical. More data would help convince me."],
      'Amy':["I understand your position. What would change your mind about this issue?","Fair points, but I believe there are solutions to address your concerns."]};
  }else{
    resp={'Sarah':["That is an interesting perspective. Could you elaborate on your reasoning?","Let me think about this from different angles. What would be the biggest challenge?"],
      'Mike':["I am not entirely convinced yet. What evidence supports this view?","That is one perspective, but I have practical questions about feasibility."],
      'Amy':["I think that is a lovely idea worth exploring further.","I agree with elements of what you said. Let me add another consideration."]};
  }

  var c=['Sarah','Mike','Amy'][Math.floor(Math.random()*3)];
  if(isDisagree&&Math.random()>.4)c='Mike';
  if(isAgree&&Math.random()>.4)c='Amy';
  var pool=resp[c];
  var r=pool[Math.floor(Math.random()*pool.length)];
  addMsg(c,r);
  document.getElementById('status').textContent='Your turn';
  await speak(r,c);
}

function runMockTurn(){
  if(!mockRunning||mockPaused||mockIdx>=MOCK_SCRIPT.length)return;
  var turn=MOCK_SCRIPT[mockIdx];
  var msgs=document.getElementById('mockMsgs');
  var colors={Sarah:'#3ba55c',Mike:'#f04747',Amy:'#f47b67',Ray:'#8e44ad'};
  var div=document.createElement('div');
  div.className='mock-msg '+turn.c.toLowerCase();
  div.innerHTML='<span class="nm" style="color:'+colors[turn.c]+' font-weight:bold">'+turn.c+':</span> <span class="tx" style="color:#aaa">'+turn.t+'</span>';
  msgs.appendChild(div);
  msgs.scrollTop=msgs.scrollHeight;
  // Wait for TTS to finish before moving to next turn
  speak(turn.t,turn.c,function(){}).then(function(){
    if(!mockRunning||mockPaused)return;
    mockIdx++;
    mockTO=setTimeout(runMockTurn,3000); // 3s pause between turns
  });
  // Also auto-advance after max 12s regardless
  var turnTO=setTimeout(function(){
    if(!mockRunning||mockPaused)return;
    mockIdx++;
    mockTO=setTimeout(runMockTurn,3000);
  },12000);
}

function updateMockTimer(){
  if(!mockRunning||mockPaused)return;
  var elapsed=Date.now()-mockStart;
  var secs=Math.floor(elapsed/1000);
  var mins=Math.floor(secs/60);
  var ss=secs%60;
  var el=document.getElementById('mockTimer');
  if(el)el.textContent=(mins<10?'0':'')+mins+':'+(ss<10?'0':'')+ss+' / 08:00';
  setTimeout(updateMockTimer,1000);
}

// Settings
function showSettings(){
  document.getElementById('settingsModal').style.display='flex';
  document.getElementById('apiKeyInput').value=apiKey;
  checkKeyStatus();
}
function closeSettings(){document.getElementById('settingsModal').style.display='none'}
function saveKey(k){apiKey=k;localStorage.setItem('minimax_api_key',k);checkKeyStatus()}
function checkKeyStatus(){
  var el=document.getElementById('apiStatus');
  if(apiKey){el.textContent='✓ Saved';el.className='status ok';}
  else{el.textContent='';el.className='status';}
}
async function testKey(){
  var k=document.getElementById('apiKeyInput').value;
  var el=document.getElementById('apiStatus');
  if(!k){el.textContent='Please enter a key';el.className='status err';return;}
  el.textContent='Testing...';el.className='status';
  try{
    var resp=await fetch('https://api.minimaxi.com/v1/t2a_v2',{
      method:'POST',
      headers:{'Authorization':'Bearer '+k,'Content-Type':'application/json'},
      body:JSON.stringify({model:'speech-2.8-hd',text:'Testing',stream:false,output_format:'url',voice_setting:{voice_id:'Cantonese_GentleLady',speed:1,pitch:0},audio_setting:{sample_rate:32000,bitrate:128000,format:'mp3',channel:1}})
    });
    if(resp.ok){el.textContent='✓ Works!';el.className='status ok';saveKey(k);}
    else{el.textContent='✗ Error: '+resp.status;el.className='status err';}
  }catch(e){el.textContent='✗ Network error';el.className='status err';}
}

// Event listeners
document.getElementById('randomBtn').onclick=startRandom;
document.getElementById('compBtn').onclick=startComp;
document.getElementById('mockBtn').onclick=showMockSelect;
document.getElementById('sarahBtn').onclick=function(){playC('Sarah')};
document.getElementById('mikeBtn').onclick=function(){playC('Mike')};
document.getElementById('amyBtn').onclick=function(){playC('Amy')};
document.getElementById('micBtn').onmousedown=startRec;
document.getElementById('micBtn').onmouseup=stopRec;
document.getElementById('micBtn').ontouchstart=function(e){e.preventDefault();startRec()};
document.getElementById('micBtn').ontouchend=stopRec;
document.getElementById('sendBtn').onclick=sendTxt;
document.getElementById('txtInput').onkeypress=function(e){if(e.key==='Enter')sendTxt()};
document.getElementById('pauseBtn').onclick=pauseRes;
document.getElementById('stopBtn').onclick=stopSpeak;
document.getElementById('settingsBtn').onclick=showSettings;
document.getElementById('closeSettingsBtn').onclick=closeSettings;
document.getElementById('testKeyBtn').onclick=testKey;
document.getElementById('apiKeyInput').onkeyup=function(e){saveKey(e.target.value)};

init();
</script>
