<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayo — DSE English Oral Practice</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: #fff; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
        .header h1 { font-size: 18px; font-weight: 700; }
        .badge { background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 12px; font-size: 11px; }
        .back-link { background: rgba(255,255,255,0.2); color: #fff; padding: 6px 12px; border-radius: 8px; text-decoration: none; font-size: 13px; }
        .back-link:hover { background: rgba(255,255,255,0.3); }
        .container { display: flex; height: calc(100vh - 56px); }
        .sidebar { width: 260px; background: #252525; border-right: 1px solid #333; overflow-y: auto; padding: 14px; }
        .sidebar h3 { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        .topic-card { background: #2d2d2d; border-radius: 8px; padding: 12px; margin-bottom: 8px; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
        .topic-card:hover { background: #363636; }
        .topic-card.active { border-color: #667eea; background: #2d3748; }
        .topic-card .cat { font-size: 10px; color: #667eea; font-weight: 600; margin-bottom: 3px; }
        .topic-card .q { font-size: 12px; color: #aaa; line-height: 1.3; }
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .topic-bar { background: #252525; padding: 14px; border-bottom: 1px solid #333; }
        .topic-bar .q { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
        .topic-bar .data { font-size: 12px; color: #aaa; background: #1e1e1e; padding: 8px 12px; border-radius: 6px; border-left: 3px solid #667eea; }
        .messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
        .msg { display: flex; gap: 10px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } }
        .avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
        .avatar.sarah { background: linear-gradient(135deg, #3ba55c, #2d8a4e); }
        .avatar.mike { background: linear-gradient(135deg, #f04747, #c73b3b); }
        .avatar.amy { background: linear-gradient(135deg, #f47b67, #d65a4a); }
        .avatar.you { background: linear-gradient(135deg, #667eea, #764ba2); }
        .msg-body { flex: 1; }
        .msg-header { display: flex; gap: 6px; align-items: baseline; margin-bottom: 3px; }
        .msg-header .name { font-weight: 700; font-size: 13px; }
        .msg-header .time { font-size: 10px; color: #666; }
        .msg-body .text { font-size: 13px; line-height: 1.5; color: #ddd; }
        .controls { padding: 14px; background: #1e1e1e; border-top: 1px solid #333; }
        .candidate-btns { display: flex; gap: 6px; margin-bottom: 10px; }
        .candidate-btns button { flex: 1; padding: 8px; background: #333; border: none; border-radius: 6px; color: #fff; cursor: pointer; font-size: 12px; font-weight: 600; }
        .candidate-btns button:hover { background: #444; }
        .candidate-btns button.sarah:hover, .candidate-btns button.sarah.active { background: #3ba55c; }
        .candidate-btns button.mike:hover, .candidate-btns button.mike.active { background: #f04747; }
        .candidate-btns button.amy:hover, .candidate-btns button.amy.active { background: #f47b67; }
        .mic-btn { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #ed4245, #c93b3b); border: none; color: #fff; font-size: 24px; cursor: pointer; margin: 0 auto; display: block; box-shadow: 0 4px 12px rgba(237,66,69,0.3); }
        .mic-btn:hover { transform: scale(1.05); }
        .mic-btn.recording { animation: pulse 0.8s infinite; }
        @keyframes pulse { 0%,100%{transform: scale(1);} 50%{transform: scale(0.95);} }
        .status { text-align: center; font-size: 12px; color: #888; margin-top: 8px; }
        .fallback { display: flex; gap: 6px; margin-top: 10px; }
        .fallback input { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #2d2d2d; color: #fff; font-size: 13px; }
        .fallback button { padding: 8px 14px; background: #667eea; border: none; border-radius: 6px; color: #fff; cursor: pointer; }
        .pause-row { display: flex; gap: 6px; margin-top: 8px; }
        .pause-row button { flex: 1; padding: 8px; background: #333; border: none; border-radius: 6px; color: #fff; cursor: pointer; font-size: 12px; }
        .pause-row button:hover { background: #444; }
        .welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; }
        .welcome h2 { font-size: 24px; margin-bottom: 10px; }
        .welcome p { color: #888; font-size: 14px; max-width: 360px; line-height: 1.6; margin-bottom: 20px; }
        .btn-main { padding: 14px 28px; background: linear-gradient(135deg, #667eea, #764ba2); border: none; border-radius: 8px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; margin: 6px; }
        .btn-main:hover { opacity: 0.9; }
        .btn-comp { background: #e74c3c; }
        #comp-view { display: none; background: #1e1e1e; min-height: 100%; padding: 20px; overflow-y: auto; }
        .comp-article h3 { color: #e74c3c; margin-bottom: 6px; }
        .comp-article .source { color: #888; font-size: 11px; margin-bottom: 14px; }
        .comp-article .article-text { background: #2d2d2d; padding: 14px; border-radius: 8px; line-height: 1.7; color: #ddd; font-size: 13px; margin-bottom: 16px; }
        .comp-question .q-num { color: #e74c3c; font-size: 12px; margin-bottom: 6px; }
        .comp-question .q-text { font-size: 15px; font-weight: 600; margin-bottom: 14px; }
        .q-options { display: flex; flex-direction: column; gap: 8px; }
        .opt-btn { padding: 10px 14px; background: #333; border: 2px solid #444; border-radius: 8px; color: #fff; text-align: left; cursor: pointer; font-size: 13px; }
        .opt-btn:hover { border-color: #667eea; }
        .opt-btn.correct { background: #27ae60; border-color: #27ae60; }
        .opt-btn.wrong { background: #c0392b; border-color: #c0392b; }
        .comp-result { text-align: center; padding: 40px; }
        .comp-result h3 { font-size: 22px; margin-bottom: 10px; }
        .comp-result .grade { font-size: 48px; color: #e74c3c; margin: 16px 0; }
        .comp-btn { padding: 12px 24px; background: #e74c3c; border: none; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; margin: 8px; }
        .back-btn { background: #444; }
        @media(max-width:768px) { .sidebar{display:none;} }
    </style>
</head>
<body>
    <div class="header">
        <a href="../index.html" class="back-link">← GameWorld</a>
        <h1>🎓 Sayo — DSE Oral Practice</h1>
        <span class="badge">FREE Browser TTS/STT</span>
    </div>
    
    <div class="container">
        <div class="sidebar">
            <h3>📚 Topics</h3>
            <div id="topic-list"></div>
        </div>
        
        <div class="main">
            <div class="topic-bar" id="topic-bar" style="display:none;">
                <div class="q" id="topic-q"></div>
                <div class="data" id="topic-data"></div>
            </div>
            
            <div class="messages" id="messages"></div>
            
            <div class="welcome" id="welcome">
                <h2>🎤 DSE English Oral Practice</h2>
                <p>Practice with 3 AI candidates — Sarah, Mike, Amy. Speak or type your answers!</p>
                <button class="btn-main" onclick="startRandom()">🎲 Random Topic</button>
                <button class="btn-main btn-comp" onclick="startComprehension()">📖 Reading Comprehension</button>
            </div>
            
            <div class="controls" id="controls" style="display:none;">
                <div class="candidate-btns">
                    <button class="sarah" onclick="playCandidate('Sarah')">👤 Sarah</button>
                    <button class="mike" onclick="playCandidate('Mike')">👤 Mike</button>
                    <button class="amy" onclick="playCandidate('Amy')">👤 Amy</button>
                </div>
                <button class="mic-btn" id="mic-btn" onmousedown="startRecord()" onmouseup="stopRecord()" ontouchstart="startRecord()" ontouchend="stopRecord()">🎤</button>
                <div class="status" id="status">Hold to record</div>
                <div class="fallback">
                    <input type="text" id="text-input" placeholder="Type your answer..." onkeypress="if(event.key==='Enter')sendText()">
                    <button onclick="sendText()">Send</button>
                </div>
                <div class="pause-row">
                    <button id="pause-btn" onclick="pauseResume()" disabled>⏸️ Pause</button>
                    <button onclick="stopSpeaking()">⏹️ Stop</button>
                </div>
            </div>
            
            <div id="comp-view"></div>
        </div>
    </div>
    
    <script>
    // ==================== TOPICS ====================
    const TOPICS = [
        { id:101, cat:"📌 REAL DSE 2026", q:"Financial literacy should be taught in all secondary schools in Hong Kong. To what extent do you agree?", d:"Surveys show only 30% of HK teens understand budgeting." },
        { id:102, cat:"📌 REAL DSE 2026", q:"Online dishonesty, such as plagiarism and fake reviews, has become a serious problem. How can we address this?", d:"45% of HK university students admitted plagiarizing." },
        { id:103, cat:"📌 REAL DSE 2026", q:"Hong Kong's street food culture is disappearing. Is this a significant loss for the city?", d:"Over 50 famous dai pai dongs closed in a decade." },
        { id:104, cat:"📌 REAL DSE 2026", q:"Autonomous vehicles should be introduced in Hong Kong. Do you agree?", d:"Self-driving taxis operate globally. HK's dense traffic poses challenges." },
        { id:105, cat:"📌 REAL DSE 2026", q:"Hong Kong should increase minimum wage for catering workers. To what extent do you agree?", d:"Catering workers earn ~HK$50/hour." },
        { id:201, cat:"📌 REAL DSE 2026", q:"AI tools like ChatGPT should be allowed in students' homework. To what extent do you agree?", d:"Educators worry about loss of critical thinking." },
        { id:202, cat:"📌 REAL DSE 2026", q:"All in the future workplace: AI will eventually replace most human jobs. Do you agree?", d:"AI could automate 30% of jobs by 2030." },
        { id:203, cat:"📌 REAL DSE 2026", q:"Tipping should become widespread in Hong Kong. Do you agree?", d:"Some restaurants added service charges." },
        { id:204, cat:"📌 REAL DSE 2026", q:"Hong Kong's country parks should be better promoted. How can this be done?", d:"Country parks cover 40% of HK land." },
        { id:205, cat:"📌 REAL DSE 2026", q:"Home remedies should be more widely accepted in Hong Kong. Discuss.", d:"TCM is popular. Some remedies controversial." },
        { id:206, cat:"📌 REAL DSE 2026", q:"Young people in Hong Kong should consider working in the Greater Bay Area. Agree?", d:"GBA includes 9 cities. Opportunities growing." },
        { id:301, cat:"📝 Practice", q:"Set-jetting — travelling to destinations seen in films — should be promoted in Hong Kong. Agree?", d:"Film tourism generates billions globally." },
        { id:1, cat:"📝 Practice", q:"Computers will eventually replace teachers in classrooms. Agree?", d:"E-learning grew 300% post-pandemic." },
        { id:2, cat:"📝 Practice", q:"Social media has a negative impact on teenagers' mental health. Do you agree?", d:"70% of HK teens spend 3+ hours daily on social media." },
        { id:3, cat:"📝 Practice", q:"Young people should prioritize careers over starting a family. Discuss.", d:"Avg marriage age: 31M/29F." },
        { id:4, cat:"📝 Practice", q:"Hong Kong should ban single-use plastics completely. Do you agree?", d:"HK generates 2,000+ tonnes plastic waste daily." },
        { id:5, cat:"📝 Practice", q:"University education should be free for all students. Discuss.", d:"HK university costs avg HK$50,000/year." },
        { id:6, cat:"📝 Practice", q:"Schools should require students to participate in at least one sport. Agree?", d:"Only 30% of HK students meet daily activity guidelines." },
        { id:7, cat:"📝 Practice", q:"AI will create more problems than it solves for society. Do you agree?", d:"AI could automate 30% of jobs by 2030." },
        { id:8, cat:"📝 Practice", q:"Traditional festivals are becoming less meaningful. Discuss.", d:"60% of young HK people find traditions outdated." },
        { id:9, cat:"📝 Practice", q:"Homework should be abolished in primary schools. Do you agree?", d:"70% of primary students spend 2+ hours on homework daily." },
        { id:10, cat:"📝 Practice", q:"Living in Hong Kong is becoming unaffordable for young people. Discuss.", d:"HK apartments cost 20x annual salary." },
        { id:11, cat:"📝 Practice", q:"Employees should work from home permanently. Agree?", d:"Remote work increased 400% during pandemic." },
        { id:12, cat:"📝 Practice", q:"Junk food advertising should be banned during children's TV programmes.", d:"30% of HK children overweight." },
        { id:13, cat:"📝 Practice", q:"Online anonymity is more harmful than beneficial. Discuss.", d:"40% of HK internet users experienced online harassment." },
        { id:14, cat:"📝 Practice", q:"Learning a second language should start from primary school. Agree?", d:"Children learning before 10 show 40% better fluency." },
        { id:15, cat:"📝 Practice", q:"The government should provide more support for elderly care. Discuss.", d:"Elderly (65+) will reach 33% by 2040." }
    ];
    
    // ==================== STATE ====================
    let currentTopic = null;
    let isRecording = false;
    let recognition = null;
    let synth = window.speechSynthesis;
    let currentUtterance = null;
    let isPaused = false;
    
    const VOICES = {
        'Sarah': { rate: 0.95, pitch: 1.1, voice: null },
        'Mike': { rate: 1.1, pitch: 0.9, voice: null },
        'Amy': { rate: 0.9, pitch: 1.2, voice: null }
    };
    
    // ==================== INIT ====================
    function init() {
        renderTopics();
        initSpeech();
    }
    
    function renderTopics() {
        const list = document.getElementById('topic-list');
        list.innerHTML = '';
        TOPICS.forEach(t => {
            const div = document.createElement('div');
            div.className = 'topic-card';
            div.innerHTML = '<div class="cat">' + t.cat + '</div><div class="q">' + t.q.substring(0, 70) + '...</div>';
            div.onclick = () => selectTopic(t);
            list.appendChild(div);
        });
    }
    
    function initSpeech() {
        const loadVoices = () => {
            const all = synth.getVoices();
            const en = all.filter(v => v.lang.startsWith('en'));
            const pref = en.length > 0 ? en : all;
            VOICES['Sarah'].voice = pref.find(v => v.name.includes('Female')) || pref[0];
            VOICES['Mike'].voice = pref.find(v => v.name.includes('Male')) || pref[1] || pref[0];
            VOICES['Amy'].voice = pref.find(v => v.name.includes('Female')) || pref[0];
        };
        loadVoices();
        synth.onvoiceschanged = loadVoices;
        
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SR) {
            recognition = new SR();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'en-US';
            recognition.onresult = e => {
                let final = '', interim = '';
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    const t = e.results[i][0].transcript;
                    if (e.results[i].isFinal) final += t;
                    else interim += t;
                }
                document.getElementById('status').textContent = interim || 'Processing...';
                if (final) {
                    addMsg('you', final);
                    synthResponse(final);
                }
            };
            recognition.onerror = () => { document.getElementById('status').textContent = 'Try again...'; };
            recognition.onend = () => { isRecording = false; document.getElementById('mic-btn').classList.remove('recording'); };
        }
    }
    
    // ==================== TOPIC ====================
    function startRandom() {
        selectTopic(TOPICS[Math.floor(Math.random() * TOPICS.length)]);
    }
    
    function selectTopic(t) {
        currentTopic = t;
        document.getElementById('welcome').style.display = 'none';
        document.getElementById('controls').style.display = 'block';
        document.getElementById('topic-bar').style.display = 'block';
        document.getElementById('comp-view').style.display = 'none';
        document.getElementById('topic-q').textContent = t.q;
        document.getElementById('topic-data').textContent = t.d;
        document.getElementById('messages').innerHTML = '';
        document.querySelectorAll('.topic-card').forEach((c, i) => {
            c.classList.toggle('active', TOPICS[i].id === t.id);
        });
        setTimeout(() => playCandidate('Sarah'), 500);
    }
    
    // ==================== MESSAGES ====================
    function addMsg(speaker, text) {
        const div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = '<div class="avatar ' + speaker.toLowerCase() + '">' + speaker[0].toUpperCase() + '</div><div class="msg-body"><div class="msg-header"><span class="name">' + speaker + '</span><span class="time">' + new Date().toLocaleTimeString() + '</span></div><div class="text">' + text + '</div></div>';
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = 99999;
    }
    
    // ==================== TTS ====================
    function speak(text, candidate, onEnd) {
        return new Promise(resolve => {
            synth.cancel();
            isPaused = false;
            const u = new SpeechSynthesisUtterance(text);
            const v = VOICES[candidate];
            u.voice = v.voice;
            u.rate = v.rate;
            u.pitch = v.pitch;
            currentUtterance = u;
            u.onend = () => { currentUtterance = null; if (onEnd) onEnd(); resolve(); };
            u.onerror = () => { currentUtterance = null; resolve(); };
            synth.speak(u);
            updatePauseBtn();
        });
    }
    
    function pauseResume() {
        if (!currentUtterance) return;
        if (isPaused) { synth.resume(); isPaused = false; }
        else { synth.pause(); isPaused = true; }
        updatePauseBtn();
    }
    
    function stopSpeaking() {
        synth.cancel();
        currentUtterance = null;
        isPaused = false;
        updatePauseBtn();
    }
    
    function updatePauseBtn() {
        const btn = document.getElementById('pause-btn');
        if (!currentUtterance) { btn.textContent = '⏸️ Pause'; btn.disabled = true; }
        else { btn.disabled = false; btn.textContent = isPaused ? '▶️ Resume' : '⏸️ Pause'; }
    }
    
    async function playCandidate(name) {
        const btn = document.querySelector('.candidate-btns .' + name.toLowerCase());
        btn.classList.add('active');
        const prompts = {
            'Sarah': 'Hello everyone, I am Sarah. Let us start discussing. ' + (currentTopic ? currentTopic.q : '') + ' What do you all think?',
            'Mike': 'I am Mike. I have some thoughts on this topic. ' + (currentTopic ? currentTopic.q : '') + ' Let me share my perspective.',
            'Amy': 'Hi, I am Amy. I agree with what has been said. ' + (currentTopic ? currentTopic.q : '') + ' Let me add some points.'
        };
        addMsg(name, prompts[name]);
        await speak(prompts[name], name, () => { btn.classList.remove('active'); document.getElementById('status').textContent = 'Your turn — hold to speak'; });
    }
    
    // ==================== AI RESPONSE ====================
    async function synthResponse(userText) {
        document.getElementById('status').textContent = 'Thinking...';
        await new Promise(r => setTimeout(r, 600));
        
        const text = userText.toLowerCase();
        const isAgree = /\\b(agree|yes|support|true|good|right|definitely)\\b/.test(text);
        const isDisagree = /\\b(disagree|no|not|wrong|against|false)\\b/.test(text);
        const mentionsAI = /\\b(ai|robot|chatgpt|technology|automation)\\b/.test(text);
        const mentionsYouth = /\\b(young|teenager|student|youth|school|children)\\b/.test(text);
        const mentionsMoney = /\\b(money|cost|salary|wage|pay|afford|expensive)\\b/.test(text);
        const mentionsHK = /\\b(hong kong|hk|asia|city|urban)\\b/.test(text);
        
        let responses;
        if (mentionsAI || mentionsWork) {
            responses = {
                'Sarah': ["AI is transforming the workplace. But will this benefit everyone equally?", "The data shows interesting trends. What sectors would be most affected?", "How can we ensure workers are properly retrained?"],
                'Mike': ["But what happens to workers who cannot adapt quickly enough?", "I am worried this could increase inequality.", "What about middle-skilled workers who get squeezed out?"],
                'Amy': ["And AI can help small businesses compete with larger ones.", "With proper training, many workers could benefit.", "The key is distributing benefits more broadly."]
            };
        } else if (mentionsYouth || mentionsEducation) {
            responses = {
                'Sarah': ["Education is fundamental. What curriculum changes are needed?", "How can schools balance academic achievement with life skills?", "Young people face unique pressures. What support do they need most?"],
                'Mike': ["I am concerned about student pressure. Are we creating unrealistic expectations?", "What about students who do not fit the traditional academic model?", "Does more testing actually lead to better outcomes?"],
                'Amy': ["Holistic development is just as important as academic results.", "Schools should also focus on mental health and emotional intelligence.", "We should celebrate different types of success."]
            };
        } else if (isAgree) {
            responses = {
                'Sarah': ["That is an excellent point. Let me add that we should consider the long-term implications.", "Could you elaborate on how this would work in practice?"],
                'Mike': ["I understand where you are coming from, but let me offer a different angle.", "Fair point, but what about implementation challenges?"],
                'Amy': ["I completely agree! This would help many people in our community.", "Exactly! It reminds me of how other places have done this successfully."]
            };
        } else if (isDisagree) {
            responses = {
                'Sarah': ["That is a valid alternative perspective. Could you share more about your view?"],
                'Mike': ["I hear your concerns, but I have some doubts. Can you provide more evidence?", "I am skeptical. What about the unintended consequences?"],
                'Amy': ["I hear your concerns, but I still believe there is merit in this approach.", "What would change your mind about this?"]
            };
        } else {
            responses = {
                'Sarah': ["That is an interesting perspective. Could you tell us more about your reasoning?", "Let me think about this from different angles. What do you think would be the biggest challenge?"],
                'Mike': ["I am not entirely convinced. What evidence supports this view?", "That is one perspective, but I have questions about the practicality."],
                'Amy': ["I think that is a lovely idea! It would really help many people.", "I agree with parts of what you said. Let me add another consideration."]
            };
        }
        
        let c = ['Sarah', 'Mike', 'Amy'][Math.floor(Math.random() * 3)];
        if (isDisagree && Math.random() > 0.4) c = 'Mike';
        if (isAgree && Math.random() > 0.4) c = 'Amy';
        
        const pool = responses[c];
        const response = pool[Math.floor(Math.random() * pool.length)];
        
        addMsg(c, response);
        document.getElementById('status').textContent = 'Your turn';
        await speak(response, c);
    }
    
    // ==================== STT ====================
    function startRecord() {
        if (!recognition) { document.getElementById('status').textContent = 'Not supported'; return; }
        isRecording = true;
        document.getElementById('mic-btn').classList.add('recording');
        document.getElementById('status').textContent = 'Listening...';
        recognition.start();
    }
    
    function stopRecord() {
        if (!isRecording) return;
        isRecording = false;
        document.getElementById('mic-btn').classList.remove('recording');
        document.getElementById('status').textContent = 'Processing...';
        recognition.stop();
    }
    
    function sendText() {
        const input = document.getElementById('text-input');
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        addMsg('you', text);
        synthResponse(text);
    }
    
    // ==================== COMPREHENSION ====================
    const COMP = [
        {
            id: 501,
            title: "AI Education in Hong Kong Schools",
            source: "SCMP",
            article: "Hong Kong authorities will offer HK$500,000 to each public school for AI funding. Schools must implement AI in at least 3 subjects and develop 6 teaching examples. Students can use AI-powered tools with supervision.",
            qs: [
                { q: "What is the purpose of the HK$500 million allocation?", o: ["To build new schools", "To promote AI adoption in classrooms", "To pay teachers' salaries", "To buy textbooks"], a: 1 },
                { q: "How many subjects must schools implement AI in?", o: ["One subject", "Two subjects", "At least three subjects", "At least six subjects"], a: 2 },
                { q: "The word 'allocate' is closest in meaning to:", o: ["Spend", "Distribute", "Save", "Borrow"], a: 1 },
                { q: "What must schools develop according to the passage?", o: ["New curriculum", "Six teaching examples using AI", "Training programs", "Research projects"], a: 1 }
            ]
        },
        {
            id: 502,
            title: "Students and AI Homework",
            source: "SCMP",
            article: "Nearly one in four Hong Kong students cannot complete homework without AI. 71% of teachers reported students using AI tools. Some experts say AI literacy is essential, but teachers worry about over-reliance and hindered critical thinking.",
            qs: [
                { q: "What proportion of students cannot complete homework without AI?", o: ["One in ten", "One in four", "Almost half", "Three in four"], a: 1 },
                { q: "What percentage of teachers reported AI use for homework?", o: ["55%", "71%", "80%", "90%"], a: 1 },
                { q: "The word 'grapple' is closest in meaning to:", o: ["Ignore", "Struggle with", "Accept", "Celebrate"], a: 1 },
                { q: "What concern do some teachers have?", o: ["AI is too expensive", "Students lack devices", "Over-reliance may hinder critical thinking", "Parents refuse AI"], a: 2 }
            ]
        },
        {
            id: 503,
            title: "Digital Divide and Ethnic Minorities",
            source: "SCMP",
            article: "Researchers from HKU surveyed 412 ethnic minority people. Only 55% found government apps user-friendly. The Equal Opportunities Commission urges using AI for language support to make apps more accessible.",
            qs: [
                { q: "How many people were surveyed?", o: ["212", "412", "515", "550"], a: 1 },
                { q: "What percentage found government apps user-friendly?", o: ["45%", "55%", "65%", "75%"], a: 1 },
                { q: "'Bridge language barriers' means:", o: ["Create more languages", "Help people communicate across languages", "Build bridges", "Learn languages"], a: 1 },
                { q: "What does the EOC suggest using AI for?", o: ["Entertainment", "Language support in apps", "Shopping", "Social media"], a: 1 }
            ]
        }
    ];
    
    let currentComp = null;
    let compQ = 0;
    let compScore = 0;
    
    function startComprehension() {
        document.getElementById('welcome').style.display = 'none';
        document.getElementById('controls').style.display = 'none';
        document.getElementById('topic-bar').style.display = 'none';
        document.getElementById('comp-view').style.display = 'block';
        currentComp = COMP[Math.floor(Math.random() * COMP.length)];
        compQ = 0;
        compScore = 0;
        showCompArticle();
    }
    
    function showCompArticle() {
        const v = document.getElementById('comp-view');
        v.innerHTML = '<div class="comp-article"><h3>' + currentComp.title + '</h3><p class="source">' + currentComp.source + '</p><div class="article-text">' + currentComp.article + '</div><button class="comp-btn" onclick="startCompQs()">Start Questions</button></div>';
    }
    
    function startCompQs() { showCompQ(); }
    
    function showCompQ() {
        const q = currentComp.qs[compQ];
        const total = currentComp.qs.length;
        let h = '<div class="comp-question">';
        h += '<p class="q-num">Question ' + (compQ + 1) + ' of ' + total + '</p>';
        h += '<p class="q-text">' + q.q + '</p>';
        h += '<div class="q-options">';
        q.o.forEach(function(opt, i) {
            h += '<button class="opt-btn" onclick="checkCompA(' + i + ')">' + String.fromCharCode(65 + i) + '. ' + opt + '</button>';
        });
        h += '</div></div>';
        document.getElementById('comp-view').innerHTML = h;
    }
    
    function checkCompA(selected) {
        const correct = currentComp.qs[compQ].a;
        document.querySelectorAll('.opt-btn').forEach(function(btn, i) {
            btn.disabled = true;
            if (i === correct) btn.classList.add('correct');
            if (i === selected && selected !== correct) btn.classList.add('wrong');
        });
        if (selected === correct) compScore++;
        setTimeout(function() {
            compQ++;
            if (compQ < currentComp.qs.length) showCompQ();
            else showCompResult();
        }, 1200);
    }
    
    function showCompResult() {
        const total = currentComp.qs.length;
        const pct = Math.round((compScore / total) * 100);
        const grade = pct >= 80 ? 'A' : pct >= 60 ? 'B' : pct >= 40 ? 'C' : 'D';
        let h = '<div class="comp-result">';
        h += '<h3>Result: ' + compScore + '/' + total + ' (' + pct + '%)</h3>';
        h += '<p class="grade">Grade: <strong>' + grade + '</strong></p>';
        h += '<button class="comp-btn" onclick="startComprehension()">Try Another</button>';
        h += '<button class="comp-btn back-btn" onclick="backToHome()">Back to Home</button></div>';
        document.getElementById('comp-view').innerHTML = h;
    }
    
    function backToHome() {
        document.getElementById('comp-view').style.display = 'none';
        document.getElementById('welcome').style.display = 'flex';
    }
    
    init();
    </script>
